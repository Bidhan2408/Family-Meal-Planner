document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-mday],[data-ingdone],summary");if(!t)return;
  const d=t.dataset;
  if(d.tab){go(d.tab);return}
  if(d.week){setWeek(iso(addDays(parseIso(S.weekId),7*+d.week)));return}
  if(d.jump!=null){S.activeDay=+d.jump;document.querySelectorAll(".daystrip button").forEach(b=>b.classList.toggle("active",b.dataset.jump===d.jump));document.getElementById("day-"+d.jump)?.scrollIntoView({behavior:"smooth",block:"start"});return}
  if(d.choose){const [day,slot]=d.choose.split(":");openSheet("pick",{day:+day,slot});return}
  if(d.open){openSheet("detail",{id:d.open});return}
  if(d.itemmenu){openSheet("itemmenu",{itemId:d.itemmenu});return}
  if(d.daynote){openSheet("daynote",{day:+d.daynote});return}
  if(d.month){const m=S.month||{y:new Date().getFullYear(),m:new Date().getMonth()};let mm=m.m+(+d.month),yy=m.y;if(mm<0){mm=11;yy--}if(mm>11){mm=0;yy++}S.month={y:yy,m:mm};render();return}
  if(d.mday){openSheet("mday",{date:d.mday});return}
  if(d.goweek){setWeek(d.goweek);closeSheet();go("plan");return}
  if(d.reuse!=null){const src=weekItems(d.reuse);if(!src.length)return;const cur=weekItems(S.weekId);const slots=enabledSlots();const next=[...cur];for(const it of src){if(it.day!=null&&next.some(x=>x.day===it.day&&x.slot===it.slot))continue;if(it.slot&&!slots.includes(it.slot))continue;next.push({...it,id:uid(),cooked:false})}
    S.undo={weekId:S.weekId,items:cur};saveWeek(S.weekId,{items:next});toast(`Copied into ${relWeek(S.weekId).toLowerCase()}`,true);closeSheet();go("plan");return}
  if(d.select){if(!S.sel)S.sel=new Set();S.sel.has(d.select)?S.sel.delete(d.select):S.sel.add(d.select);render();return}
  if(d.filter){S.filter=d.filter;render();return}
  if(d.pfilter){S.sheet.filter=d.pfilter;document.querySelectorAll("[data-pfilter]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.pfilter===d.pfilter)));drawPickList();return}
  if(d.tick){
    const s=S.sheet;const r=S.recipes.get(d.tick);
    if(s.day!=null){
      if(s.swap){const cur=weekItems(S.weekId);S.undo={weekId:S.weekId,items:cur};const next=cur.map(i=>i.id===s.swap?{...i,rid:d.tick,cooked:false,leftover:false}:i);saveWeek(S.weekId,{items:next});toast(`Swapped in ${r?.name||"dish"}`,true)}
      else{const ex=itemAt(s.day,s.slot);S.undo={weekId:S.weekId,items:weekItems(S.weekId)};addToWeek(d.tick,s.day,s.slot);toast(ex?`Replaced with ${r?.name}`:`${r?.name} on ${slotLabel(s.day,s.slot)}`,true)}
      closeSheet();
    }else{closeSheet();openSheet("slotpick",{rid:d.tick})}
    return}
  if(d.slotpick){const [day,slot]=d.slotpick.split(":");const s=S.sheet;
    if(s.itemId){S.undo={weekId:S.weekId,items:weekItems(S.weekId)};moveItem(s.itemId,+day,slot);toast(`Moved to ${slotLabel(+day,slot)}`,true)}
    else{S.undo={weekId:S.weekId,items:weekItems(S.weekId)};addToWeek(s.rid,+day,slot);toast(`Added to ${slotLabel(+day,slot)}`,true)}
    closeSheet();go("plan");return}
  if(d.addweek){closeSheet();openSheet("slotpick",{rid:d.addweek});return}
  if(d.swapitem){const it=weekItems(S.weekId).find(i=>i.id===d.swapitem);if(it)openSheet("pick",{day:it.day,slot:it.slot,swap:it.id});return}
  if(d.moveitem){const it=weekItems(S.weekId).find(i=>i.id===d.moveitem);if(it)openSheet("slotpick",{rid:it.rid,itemId:it.id});return}
  if(d.leftover){const it=weekItems(S.weekId).find(i=>i.id===d.leftover);if(it)patchItem(it.id,{leftover:!it.leftover});closeSheet();return}
  if(d.cooks){openSheet("cooks",{itemId:d.cooks});return}
  if(d.setcook!=null){patchItem(S.sheet.itemId,{cook:d.setcook});closeSheet();return}
  if(d.rateitem){const it=weekItems(S.weekId).find(i=>i.id===d.rateitem);if(it)openSheet("rate",{rid:it.rid,itemId:it.id});return}
  if(d.rate){openSheet("rate",{rid:d.rate,itemId:S.sheet?.itemId});return}
  if(d.thumb){S.sheet.rating=+d.thumb;document.querySelectorAll("[data-thumb]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.thumb===d.thumb)));return}
  if(d.remove){removeItem(d.remove);closeSheet();return}
  if(d.cook){openCook(d.cook,d.cookitem);return}
  if(d.cookstep){S.cook.step=Math.max(0,S.cook.step+(+d.cookstep));S.cook.view="steps";drawCook();$("#cook .cb")?.scrollTo(0,0);return}
  if(d.cookview){S.cook.view=d.cookview;drawCook();return}
  if(d.cookserv){S.cook.servings=Math.max(1,S.cook.servings+(+d.cookserv));drawCook();return}
  if(d.ingdone!=null){const k=+d.ingdone;S.cook.done.has(k)?S.cook.done.delete(k):S.cook.done.add(k);drawCook();return}
  if(d.timer){const secs=+d.timer;const c=S.cook;S.timers.push({id:uid(),end:Date.now()+secs*1000,label:d.tlabel,stepKey:c.rid+":"+c.step+":"+secs});startTick();drawCook();return}
  if(d.timerstop){S.timers=S.timers.filter(t=>t.id!==d.timerstop);drawCook();return}
  if(d.serv){S.sheet.servings=Math.max(1,(S.sheet.servings||S.recipes.get(S.sheet.id)?.servings||4)+(+d.serv));drawSheet();return}
  if(d.defserv){const s=S.sheet;s.servings=Math.max(1,(s.servings??S.settings.servings??4)+(+d.defserv));const b=t.parentElement.querySelector("b");if(b)b.textContent=`${s.servings} people`;return}
  if(d.fav){const r=S.recipes.get(d.fav);if(r)saveRecipe({...r,fav:!r.fav});return}
  if(d.rmphoto){const r=S.recipes.get(d.rmphoto);if(r){const c={...r};delete c.photoData;saveRecipe(c)}return}
  if(d.edit){openSheet("edit",{recipe:S.recipes.get(d.edit)});return}
  if(d.kind){document.querySelectorAll("#f-kind button").forEach(b=>b.setAttribute("aria-pressed",String(b===t)));$("#editform").kind.value=d.kind;$("#fullfields").hidden=d.kind!=="full";return}
  if(d.meal){t.setAttribute("aria-pressed",String(t.getAttribute("aria-pressed")!=="true"));return}
  if(t.id==="f-veg"){t.setAttribute("aria-checked",String(t.getAttribute("aria-checked")!=="true"));return}
  if(d.switch){t.setAttribute("aria-checked",String(t.getAttribute("aria-checked")!=="true"));return}
  if(d.vegday!=null){t.setAttribute("aria-pressed",String(t.getAttribute("aria-pressed")!=="true"));return}
  if(d.ws){document.querySelectorAll("[data-ws]").forEach(b=>b.setAttribute("aria-pressed",String(b===t)));return}
  if(d.norepeat){document.querySelectorAll("[data-norepeat]").forEach(b=>b.setAttribute("aria-pressed",String(b===t)));return}
  if(d.newper){document.querySelectorAll("[data-newper]").forEach(b=>b.setAttribute("aria-pressed",String(b===t)));return}
  if(d.del){S.sheet={kind:"confirmdel",id:d.del};const r=S.recipes.get(d.del);$("#sheet").innerHTML=head("Delete this dish?",esc(r?.name||""))+`<div class="sheetbody"><p>Past weeks will show it as a deleted recipe.</p></div><div class="sheetfoot"><button class="btn danger" style="background:var(--danger-soft)" data-confirmdel="${esc(d.del)}">Delete</button><button class="btn" data-act="close">Keep it</button></div>`;return}
  if(d.confirmdel){deleteRecipe(d.confirmdel);closeSheet();toast("Deleted");return}
  if(d.import){openSheet("import",{mode:d.import});return}
  if(d.plan){const items=planWeek(d.plan);S.undo={weekId:S.weekId,items:weekItems(S.weekId)};saveWeek(S.weekId,{items});closeSheet();toast("Week planned. Not happy with a meal? Swap it.",true);return}
  if(d.shoptick){const shop=weekDoc(S.weekId).shop||{checked:[],extras:[]};const set=new Set(shop.checked||[]);set.has(d.shoptick)?set.delete(d.shoptick):set.add(d.shoptick);saveWeek(S.weekId,{shop:{...shop,checked:[...set]}});return}
  if(d.shopdel){const shop=weekDoc(S.weekId).shop||{checked:[],extras:[]};saveWeek(S.weekId,{shop:{checked:(shop.checked||[]).filter(k=>k!=="x:"+d.shopdel),extras:(shop.extras||[]).filter(x=>x.id!==d.shopdel)}});return}
  switch(d.act){
    case "close":closeSheet();break;
    case "undo":if(S.undo){saveWeek(S.undo.weekId,{items:S.undo.items});S.undo=null;$("#toast").hidden=true}break;
    case "settings":openSheet("settings");break;
    case "weekmenu":openSheet("weekmenu");break;
    case "autoplan":if(!S.recipes.size){toast("Add some dishes first");break}openSheet("autoplan");break;
    case "suggest":openSheet("suggest");break;
    case "newmenu":openSheet("newmenu");break;
    case "new":openSheet("edit",{recipe:null});break;
    case "gpt":openSheet("gpt",{});break;
    case "gptcopy":copyPrompt();break;
    case "gptread":readGptReply();break;
    case "export":exportBackup();break;
    case "install":{const p=S.installPrompt;if(!p)break;p.prompt();p.userChoice.then(()=>{S.installPrompt=null;render()}).catch(()=>{});break}
    case "nobanner":ls.set("ok:nobanner",1);render();break;
    case "starters":addStarters();break;
    case "signout":closeSheet();S.auth?.signOut();break;
    case "signin":{const email=($("#si-email")?.value||"").trim(),pass=$("#si-pass")?.value||"";if(!email||!pass){toast("Type the family email and password");break}t.disabled=true;t.textContent="Signing in…";S.auth.signInWithEmailAndPassword(email,pass).catch(e=>{$("#app").innerHTML=signInHtml(authErr(e&&e.code));$("#si-email").value=email});break}
    case "aisave":openRecipeFromAI(false);break;
    case "aisaveadd":openRecipeFromAI(true);break;
    case "today":setWeek(defaultWeekId());closeSheet();break;
    case "gotoshop":closeSheet();go("shop");break;
    case "clearweek":setItems([],"Week cleared");closeSheet();break;
    case "shareplan":shareText(planText(S.weekId),"Meal plan");closeSheet();break;
    case "sharelist":shareText(shoppingText(S.weekId),"Shopping list");break;
    case "shopadd":{const inp=$("#shopadd");const v=(inp?.value||"").trim();if(!v){inp?.focus();break}const shop=weekDoc(S.weekId).shop||{checked:[],extras:[]};S.shopQ="";saveWeek(S.weekId,{shop:{...shop,extras:[...(shop.extras||[]),{id:uid(),text:v.slice(0,80)}]}});S._refocus="shopadd";render();break}
    case "savenote":{const v=($("#daynote")?.value||"").trim();const notes={...(weekDoc(S.weekId).notes||{})};if(v)notes[S.sheet.day]=v.slice(0,120);else delete notes[S.sheet.day];saveWeek(S.weekId,{notes});closeSheet();break}
    case "clearnote":{const notes={...(weekDoc(S.weekId).notes||{})};delete notes[S.sheet.day];saveWeek(S.weekId,{notes});closeSheet();break}
    case "saverate":{const s=S.sheet;saveRating(s.rid,s.rating||0,$("#ratenote")?.value,s.itemId);closeSheet();toast("Thanks, noted for next time");break}
    case "cookdone":{const c=S.cook;closeCook();openSheet("rate",{rid:c.rid,itemId:c.itemId});break}
    case "closecook":closeCook();break;
    case "walknext":if(S.walk>=WALK.length-1){S.walk=null;ls.set("ok:tour",1)}else S.walk++;drawWalk();break;
    case "walkskip":S.walk=null;ls.set("ok:tour",1);drawWalk();break;
    case "retour":closeSheet();S.walk=0;drawWalk();break;
    case "savesettings":{
      const slots={...S.settings.slots};document.querySelectorAll("[data-switch]").forEach(b=>{const k=b.dataset.switch.split(":")[1];slots[k]=b.getAttribute("aria-checked")==="true"});
      const vegDays=[...document.querySelectorAll("[data-vegday]")].filter(b=>b.getAttribute("aria-pressed")==="true").map(b=>+b.dataset.vegday);
      const ws=+(document.querySelector("[data-ws][aria-pressed='true']")?.dataset.ws??S.settings.weekStart);
      const noRepeatWeeks=+(document.querySelector("[data-norepeat][aria-pressed='true']")?.dataset.norepeat||3);
      const newPerWeek=+(document.querySelector("[data-newper][aria-pressed='true']")?.dataset.newper||0);
      const cooks=($("#s-cooks")?.value||"").split(",").map(x=>x.trim()).filter(Boolean).slice(0,8);
      const pantry=($("#s-pantry")?.value||"").split(/,|\n/).map(x=>x.trim().toLowerCase()).filter(Boolean).slice(0,120);
      const changedWs=ws!==S.settings.weekStart;
      saveSettings({slots,vegDays,weekStart:ws,noRepeatWeeks,newPerWeek,cooks,pantry,servings:S.sheet.servings??S.settings.servings??4});
      if(changedWs&&!S.weekTouched)S.weekId=defaultWeekId();
      closeSheet();toast("Settings saved");break}
    case "estimate":toggleEstimate();break;
    case "estcopy":copyEstimatePrompt();break;
    case "estfill":fillEstimate();break;
    case "select":S.sel=new Set();render();break;
    case "selcancel":S.sel=null;render();break;
    case "selall":{const H=historyIndex();sortedRecipes().filter(r=>matches(r,S.filter,S.q,H)).forEach(r=>S.sel.add(r.id));render();break}
    case "selstarters":STARTERS.forEach(id=>{if(S.recipes.has(id))S.sel.add(id)});render();break;
    case "bulkdel":{if(!S.sel?.size)break;const n=S.sel.size;S.sheet={kind:"confirmbulk"};$("#scrim").hidden=false;document.body.style.overflow="hidden";$("#sheet").innerHTML=head(`Delete ${n} dish${n>1?"es":""}?`)+`<div class="sheetbody"><p>${esc([...S.sel].slice(0,8).map(id=>S.recipes.get(id)?.name).filter(Boolean).join(", "))}${n>8?` and ${n-8} more`:""}.</p><p class="hint">Past weeks will show them as deleted recipes. This can’t be undone.</p></div><div class="sheetfoot"><button class="btn danger" style="background:var(--danger-soft)" data-act="bulkdelgo">Delete ${n}</button><button class="btn" data-act="close">Keep them</button></div>`;break}
    case "bulkdelgo":{const ids=[...(S.sel||[])];S.sel=null;closeSheet();ids.forEach(id=>deleteRecipe(id));toast(`Deleted ${ids.length} dish${ids.length>1?"es":""}`);break}
    case "saverecipe":{
      const f=$("#editform");const name=f.name.value.trim();if(!name){f.name.focus();toast("Give the dish a name");return}
      const num=x=>x===""?undefined:Math.max(0,Math.round(+x));const split=x=>x.split("\n").map(s=>s.trim()).filter(Boolean);
      const prev=S.sheet.recipe||{};
      const meals=[...document.querySelectorAll("#f-meals button")].filter(b=>b.getAttribute("aria-pressed")==="true").map(b=>b.dataset.meal);
      const r={...prev,name,kind:f.kind.value,cuisine:f.cuisine.value,emoji:f.emoji.value.trim()||undefined,alias:f.alias.value.trim()||undefined,desc:f.desc.value.trim()||undefined,veg:$("#f-veg").getAttribute("aria-checked")==="true",meals:meals.length?meals:["lunch","dinner"],minutes:num(f.minutes.value),kcal:num(f.kcal.value),protein:num(f.protein.value),carbs:num(f.carbs.value),fat:num(f.fat.value),servings:num(f.servings.value),ingredients:split(f.ingredients.value),steps:split(f.steps.value),notes:f.notes.value.trim(),createdAt:prev.createdAt||Date.now()};
      const from=S.sheet.from;
      saveRecipe(r).then(id=>{toast(`Saved ${name}`);if(from)openSheet("pick",from)});
      if(!from)closeSheet();break}
  }
});
document.addEventListener("input",e=>{
  if(e.target.id==="rsearch"){S.q=e.target.value;S._refocus="rsearch";render()}
  if(e.target.id==="psearch"){S.sheet.q=e.target.value;drawPickList()}
  if(e.target.id==="shopadd")S.shopQ=e.target.value;
  if(e.target.id==="gptq"&&S.sheet){S.sheet.q=e.target.value;const p=$("#gptprompt");if(p)p.value=gptPrompt(S.sheet.q)}
  if(e.target.id==="gptreply"&&S.sheet)S.sheet.reply=e.target.value;
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="rsort"){S.sort=t.value;render()}
  if(t.dataset.photo&&t.files?.[0]){uploadPhoto(t.dataset.photo,t.files[0]);t.value=""}
  if(t.hasAttribute("data-importfile")&&t.files?.[0]){importBackup(t.files[0]);t.value=""}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(S.sheet)closeSheet();else if(S.cook)closeCook()}if(e.key==="Enter"&&e.target.id==="shopadd"){e.preventDefault();$("[data-act='shopadd']")?.click()}if(e.key==="Enter"&&e.target.closest?.("#signin")){e.preventDefault();$("[data-act='signin']")?.click()}});
$("#scrim").addEventListener("click",e=>{if(e.target.id==="scrim")closeSheet()});
function shareText(text,title){
  if(navigator.share){navigator.share({title,text}).catch(()=>{});return}
  navigator.clipboard?.writeText(text).then(()=>toast("Copied, paste it anywhere"),()=>toast("Couldn’t copy"));
}
/* picker → new dish → back to picker */
const _open=openSheet;
openSheet=function(kind,opts={}){
  if(kind==="edit"&&S.sheet&&S.sheet.kind==="pick"&&S.sheet.day!=null)opts.from={day:S.sheet.day,slot:S.sheet.slot,q:S.sheet.q,filter:S.sheet.filter,swap:S.sheet.swap};
  if(kind==="edit"&&S.sheet&&S.sheet.kind==="newmenu"&&S.sheet.from)opts.from=S.sheet.from;
  if(kind==="newmenu"&&S.sheet&&S.sheet.kind==="pick"&&S.sheet.day!=null)opts.from={day:S.sheet.day,slot:S.sheet.slot,q:S.sheet.q,filter:S.sheet.filter,swap:S.sheet.swap};
  _open(kind,opts);
};

/* ---------- drag and drop (desktop) ---------- */
document.addEventListener("dragstart",e=>{const m=e.target.closest?.(".meal[data-item]");if(!m)return;S.drag=m.dataset.item;e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain",S.drag)}catch(x){}m.classList.add("lifted")});
document.addEventListener("dragend",e=>{document.querySelectorAll(".lifted,.over").forEach(x=>x.classList.remove("lifted","over"));S.drag=null});
document.addEventListener("dragover",e=>{const z=e.target.closest?.("[data-dropzone]");if(!z||!S.drag)return;e.preventDefault();e.dataTransfer.dropEffect="move";document.querySelectorAll(".over").forEach(x=>x!==z&&x.classList.remove("over"));z.classList.add("over")});
document.addEventListener("dragleave",e=>{const z=e.target.closest?.("[data-dropzone]");if(z&&!z.contains(e.relatedTarget))z.classList.remove("over")});
document.addEventListener("drop",e=>{const z=e.target.closest?.("[data-dropzone]");if(!z||!S.drag)return;e.preventDefault();const [day,slot]=z.dataset.dropzone.split(":");const id=S.drag;S.drag=null;const it=weekItems(S.weekId).find(i=>i.id===id);if(!it||(it.day===+day&&it.slot===slot))return;S.undo={weekId:S.weekId,items:weekItems(S.weekId)};moveItem(id,+day,slot);toast(`Moved to ${slotLabel(+day,slot)}`,true)});

/* ---------- press and hold (touch) ---------- */
let press=null;
document.addEventListener("pointerdown",e=>{
  if(e.pointerType==="mouse")return;const m=e.target.closest?.(".meal[data-item]");if(!m)return;
  press={id:m.dataset.item,x:e.clientX,y:e.clientY,t:setTimeout(()=>{m.classList.add("lifted");try{navigator.vibrate?.(15)}catch(x){}press.fired=true;setTimeout(()=>{m.classList.remove("lifted");openSheet("itemmenu",{itemId:m.dataset.item})},120)},450)};
},{passive:true});
function cancelPress(e){if(!press)return;if(e&&e.type==="pointermove"&&Math.hypot(e.clientX-press.x,e.clientY-press.y)<10)return;clearTimeout(press.t);press=null}
document.addEventListener("pointermove",cancelPress,{passive:true});document.addEventListener("pointerup",cancelPress);document.addEventListener("pointercancel",cancelPress);
document.addEventListener("click",e=>{if(press?.fired){e.stopPropagation();e.preventDefault();press=null}},true);
document.addEventListener("contextmenu",e=>{if(e.target.closest?.(".meal[data-item]")&&matchMedia("(pointer:coarse)").matches)e.preventDefault()});

/* ---------- scroll spy for the day strip ---------- */
let spyT=null;
window.addEventListener("scroll",()=>{if(S.tab!=="plan"||spyT)return;spyT=setTimeout(()=>{spyT=null;const top=140;let cur=null;document.querySelectorAll(".day").forEach(sec=>{if(sec.getBoundingClientRect().top<=top+20)cur=sec.id.split("-")[1]});if(cur!=null&&String(S.activeDay)!==cur){S.activeDay=+cur;document.querySelectorAll(".daystrip button").forEach(b=>b.classList.toggle("active",b.dataset.jump===cur))}},120)},{passive:true});

/* ============================================================
   Boot
   ============================================================ */
const navHtml=TABS.map(([k,l,i])=>`<button data-tab="${k}" aria-selected="${k===S.tab}">${ic(i)}<span>${l}</span></button>`).join("");
$("#navbottom").innerHTML=navHtml;$("#sidenav").innerHTML=`<div class="brand">Our Kitchen</div>`+navHtml+`<div class="spacer"></div><button data-act="settings">${ic("gear")}<span>Settings</span></button>`;
$("#app").innerHTML=topbar("Our Kitchen")+`<div class="skel"></div><div class="skel"></div><div class="skel" style="width:70%"></div>`;
/* ---------- install as an app ---------- */
const isStandalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const isIOS=()=>/iPhone|iPad|iPod/.test(navigator.userAgent)&&!window.MSStream;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();S.installPrompt=e;if(S.tab==="plan")render()});
window.addEventListener("appinstalled",()=>{S.installPrompt=null;ls.set("ok:installed",1);toast("Installed. Open Our Kitchen from your home screen.");render()});
if("serviceWorker" in navigator&&/^https?:/.test(location.protocol)){window.addEventListener("load",()=>{navigator.serviceWorker.register("./sw.js").catch(()=>{})})}
function installHtml(){
  if(isStandalone()||ls.get("ok:nobanner",0))return "";
  const mobile=matchMedia("(pointer:coarse)").matches;if(!mobile)return "";
  if(S.installPrompt)return `<div class="balance" style="display:flex;align-items:center;gap:12px"><img src="icon-192.png" alt="" style="width:40px;height:40px;border-radius:10px"><div style="flex:1;min-width:0"><b>Install Our Kitchen</b><div class="hint">Gets its own icon, opens full screen, works offline.</div></div><button class="btn sm primary" data-act="install">Install</button><button class="ibtn plain" data-act="nobanner" aria-label="Not now">${ic("x")}</button></div>`;
  if(isIOS())return `<div class="balance" style="display:flex;align-items:center;gap:12px"><img src="icon-192.png" alt="" style="width:40px;height:40px;border-radius:10px"><div style="flex:1;min-width:0"><b>Put it on your home screen</b><div class="hint">In Safari tap Share, then “Add to Home Screen”. It then opens like an app.</div></div><button class="ibtn plain" data-act="nobanner" aria-label="Not now">${ic("x")}</button></div>`;
  return "";
}
window.addEventListener("online",()=>{S.online=true;renderStatus()});window.addEventListener("offline",()=>{S.online=false;renderStatus()});
(function boot(){
  const cfg=window.FIREBASE_CONFIG||{};
  if(!window.firebase){$("#app").innerHTML=setupHtml("The Firebase scripts didn’t load. Check the internet connection and reload.");return}
  if(!cfg.apiKey||/PASTE/i.test(cfg.apiKey)||/PASTE/i.test(cfg.projectId||"")){$("#app").innerHTML=setupHtml();$("#navbottom").hidden=true;$("#sidenav").hidden=true;return}
  try{firebase.initializeApp(cfg)}catch(e){$("#app").innerHTML=setupHtml("The Firebase config at the top of index.html doesn’t look right. Paste it again exactly as the console shows it.");return}
  const db=firebase.firestore();
  try{db.settings({ignoreUndefinedProperties:true})}catch(e){}
  try{db.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
  S.auth=firebase.auth();
  let subs=[];
  S.auth.onAuthStateChanged(user=>{
    subs.forEach(u=>{try{u()}catch(e){}});subs=[];S.user=user;
    if(!user){S.db=null;S.live=false;S.recipes=new Map();S.weeks=new Map();if(S.sheet)closeSheet();if(S.cook)closeCook();$("#navbottom").hidden=true;$("#sidenav").hidden=true;$("#app").innerHTML=signInHtml();return}
    $("#navbottom").hidden=false;$("#sidenav").hidden=false;
    S.db=db;S.ready=true;
    if(!ls.get("ok:tour",0)){S.walk=0;drawWalk()}
    let gotSettings=false;
    subs.push(db.doc("settings/main").onSnapshot(snap=>{
      const v=snap.exists?snap.data():null;const before=S.settings.weekStart;
      S.settings={...DEFAULT_SETTINGS,...(v||{})};S.settings.slots={...DEFAULT_SETTINGS.slots,...(v?.slots||{})};
      if(!gotSettings||before!==S.settings.weekStart){if(!S.weekTouched)S.weekId=defaultWeekId()}
      gotSettings=true;S.live=true;render();
    },()=>{}));
    subs.push(db.collection("recipes").onSnapshot(snap=>{S.recipes=new Map(snap.docs.map(d=>[d.id,{...d.data(),id:d.id}]));S.live=true;render();refreshSheet()},err=>toast(err&&err.code==="permission-denied"?"No access to the recipes. Check the Firestore rules in the setup guide.":"Lost connection to the recipes. Reload the page.")));
    subs.push(db.collection("weeks").onSnapshot(snap=>{S.weeks=new Map(snap.docs.map(d=>[d.id,d.data()]));S.live=true;render();refreshSheet()},()=>{}));
    render();
  });
})();
})();

</script>
