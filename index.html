<style>
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --surface-2:#F6F8F5; --ink:#15201B; --ink-2:#55615A; --ink-3:#8A958E; --line:#E0E6DF; --line-2:#CAD3CB;
  --accent:#E09B1F; --accent-ink:#2B1D00; --accent-soft:#FBEFD3;
  --danger:#C84B3A; --danger-soft:#FBE4E0; --leaf:#3F8A4E; --leaf-soft:#E3F1E4; --sky:#4461A8; --sky-soft:#E6EBF8; --plum:#7A4C9A; --plum-soft:#EFE6F6;
  --shadow-1:0 1px 2px rgba(21,32,27,.06), 0 2px 8px rgba(21,32,27,.05);
  --shadow-2:0 2px 6px rgba(21,32,27,.08), 0 12px 32px -12px rgba(21,32,27,.28);
  --nav-h:64px;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1412; --surface:#1A211D; --surface-2:#222B25; --ink:#EEF2EC; --ink-2:#A9B4AB; --ink-3:#737E76; --line:#2B352E; --line-2:#3A463D;
    --accent:#F0B445; --accent-ink:#2B1D00; --accent-soft:#3A2C10;
    --danger:#E77B6B; --danger-soft:#3D1F1A; --leaf:#7FC28A; --leaf-soft:#1E3324; --sky:#9DB3F0; --sky-soft:#1F2740; --plum:#C9A6E6; --plum-soft:#2E2238;
    --shadow-1:0 1px 2px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.25);
    --shadow-2:0 2px 6px rgba(0,0,0,.35), 0 14px 36px -12px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1412; --surface:#1A211D; --surface-2:#222B25; --ink:#EEF2EC; --ink-2:#A9B4AB; --ink-3:#737E76; --line:#2B352E; --line-2:#3A463D;
  --accent:#F0B445; --accent-ink:#2B1D00; --accent-soft:#3A2C10;
  --danger:#E77B6B; --danger-soft:#3D1F1A; --leaf:#7FC28A; --leaf-soft:#1E3324; --sky:#9DB3F0; --sky-soft:#1F2740; --plum:#C9A6E6; --plum-soft:#2E2238;
  --shadow-1:0 1px 2px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.25);
  --shadow-2:0 2px 6px rgba(0,0,0,.35), 0 14px 36px -12px rgba(0,0,0,.7);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 130px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;font-feature-settings:"tnum"}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
svg.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
[hidden]{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh;min-height:100dvh}
.sidenav{display:none}
.content{flex:1;min-width:0;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 24px)}
.page{max-width:820px;margin:0 auto;padding:0 16px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:12px 0 8px;display:flex;align-items:center;gap:8px}
.topbar .title{flex:1;min-width:0}
.topbar h1{font-family:var(--display);font-weight:800;font-size:1.35rem;letter-spacing:-.02em;margin:0;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sub{color:var(--ink-2);font-size:.85rem}
.ibtn{border:0;background:var(--surface);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);box-shadow:var(--shadow-1);flex:none;transition:transform .12s ease}
.ibtn:active{transform:scale(.92)}
.ibtn.plain{background:transparent;box-shadow:none}
.status{font-size:.78rem;color:var(--ink-3);display:flex;align-items:center;gap:5px;white-space:nowrap}
.status i{width:7px;height:7px;border-radius:50%;background:var(--leaf);display:inline-block}
.status.off i{background:var(--ink-3)}
.status.ro i{background:var(--accent)}

nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-around}
nav.bottom button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;font-weight:600;color:var(--ink-3);padding:4px 0;border-radius:12px;max-width:120px}
nav.bottom button svg.ic{width:24px;height:24px}
nav.bottom button[aria-selected="true"]{color:var(--ink)}
nav.bottom button[aria-selected="true"] svg.ic{stroke:var(--accent);stroke-width:2.2}

@media (min-width:900px){
  :root{--nav-h:0px}
  nav.bottom{display:none}
  .sidenav{display:flex;flex-direction:column;gap:4px;width:220px;flex:none;padding:24px 14px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;height:100dvh;background:var(--surface)}
  .sidenav .brand{font-family:var(--display);font-weight:800;font-size:1.4rem;letter-spacing:-.02em;padding:6px 10px 18px}
  .sidenav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:10px 12px;border-radius:12px;font-weight:600;color:var(--ink-2);text-align:left}
  .sidenav button[aria-selected="true"]{background:var(--surface-2);color:var(--ink)}
  .sidenav button[aria-selected="true"] svg.ic{stroke:var(--accent)}
  .sidenav .spacer{flex:1}
  .page{max-width:1240px;padding:0 32px}
  .content{padding-bottom:40px}
  .topbar{padding:22px 0 12px}
  .topbar h1{font-size:1.7rem}
}

/* ---------- buttons ---------- */
.btn{border:1px solid var(--line-2);background:var(--surface);padding:10px 16px;border-radius:14px;font-weight:700;font-size:.95rem;display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:transform .12s ease,background .15s ease;line-height:1.2}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.soft{background:var(--surface-2);border-color:transparent}
.btn.danger{color:var(--danger);border-color:transparent;background:transparent}
.btn.sm{padding:7px 12px;font-size:.86rem;border-radius:11px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.row-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- week ---------- */
.weekhead{display:flex;align-items:center;gap:10px;margin:8px 0 10px}
.weekhead .arrow{width:38px;height:38px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow-1);display:grid;place-items:center;flex:none}
.weekhead .t{flex:1;min-width:0}
.weekhead .rel{font-family:var(--display);font-weight:800;font-size:1.9rem;letter-spacing:-.03em;line-height:1;margin:0}
.weekhead .range{color:var(--ink-2);font-size:.9rem;margin-top:2px}
.planbar{display:flex;gap:8px;margin:6px 0 14px}
.planbar .btn{flex:1}

.balance{background:var(--surface);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow-1);margin-bottom:14px}
.balance .line{display:flex;align-items:center;gap:6px;font-size:.9rem;color:var(--ink-2)}
.balance .line .txt{flex:1;min-width:0;line-height:1.6}
.balance .line b{color:var(--ink);font-family:var(--display);font-size:1.05rem}
.balance .bars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.balance .bar{background:var(--surface-2);border-radius:12px;padding:8px 10px}
.balance .bar b{display:block;font-family:var(--display);font-size:1.2rem;line-height:1.1}
.balance .bar span{font-size:.75rem;color:var(--ink-2)}
.balance .track{height:4px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden}
.balance .track i{display:block;height:100%;background:var(--leaf);border-radius:2px}
@media (max-width:420px){ .balance .bars{grid-template-columns:repeat(2,1fr)} }

.daystrip{position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:15;background:var(--bg);display:flex;gap:6px;padding:4px 0 10px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.daystrip::-webkit-scrollbar{display:none}
.daystrip button{flex:1;min-width:46px;border:0;background:var(--surface);border-radius:14px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:var(--shadow-1);color:var(--ink-2)}
.daystrip button b{font-family:var(--display);font-size:1rem;line-height:1;color:var(--ink)}
.daystrip button small{font-size:.72rem}
.daystrip button .dots{display:flex;gap:3px;height:6px;margin-top:3px}
.daystrip button .dots i{width:5px;height:5px;border-radius:50%;background:var(--line-2)}
.daystrip button .dots i.on{background:var(--leaf)}
.daystrip button.today b{color:var(--accent)}
.daystrip button.active{outline:2px solid var(--ink);outline-offset:-2px}

.day{padding:10px 0 4px;scroll-margin-top:140px}
.dayhead{display:flex;align-items:baseline;gap:8px;margin:0 0 8px;padding:0 2px}
.dayhead h2{font-family:var(--display);font-weight:800;font-size:1.3rem;letter-spacing:-.02em;margin:0}
.dayhead .d{color:var(--ink-2);font-size:.9rem}
.dayhead.today h2{color:var(--accent)}
.dayhead .tag{margin-left:2px}
.dayhead .notebtn{margin-left:auto;border:0;background:none;color:var(--ink-3);display:flex;align-items:center;gap:4px;font-size:.8rem;padding:2px 6px;border-radius:8px;max-width:60%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.dayhead .notebtn.has{color:var(--ink-2);background:var(--surface-2)}
.slots{display:grid;gap:8px}
.meal{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:18px;padding:10px 10px 10px 10px;box-shadow:var(--shadow-1);min-height:76px;position:relative;transition:transform .15s ease,box-shadow .15s ease;user-select:none;-webkit-user-select:none}
.meal.lifted{transform:scale(1.02);box-shadow:var(--shadow-2)}
.meal.over{outline:2px dashed var(--accent);outline-offset:-2px}
.meal.empty{background:transparent;box-shadow:none;border:1.5px dashed var(--line-2);color:var(--ink-2);cursor:pointer;min-height:64px;padding:8px 12px}
.meal.empty:hover{border-color:var(--accent);color:var(--ink)}
.meal.empty .plus{width:40px;height:40px;border-radius:12px;background:var(--surface);display:grid;place-items:center;color:var(--ink-3);flex:none}
.meal .open{flex:1;min-width:0;display:flex;align-items:center;gap:12px;border:0;background:none;padding:0;text-align:left}
.tile{width:56px;height:56px;border-radius:14px;flex:none;display:grid;place-items:center;font-size:1.7rem;overflow:hidden;position:relative}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile.sm{width:44px;height:44px;border-radius:12px;font-size:1.35rem}
.tile.lg{width:100%;height:160px;border-radius:20px;font-size:4rem}
.meal .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.meal .slotname{font-size:.74rem;font-weight:700;color:var(--ink-3);letter-spacing:.01em}
.meal .name{font-weight:700;font-size:1.02rem;line-height:1.25;overflow-wrap:anywhere;color:var(--ink)}
.meal .meta{color:var(--ink-2);font-size:.82rem;display:flex;gap:6px;flex-wrap:wrap;margin-top:2px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.pill.leaf{background:var(--leaf-soft);color:var(--leaf)}
.pill.sky{background:var(--sky-soft);color:var(--sky)}
.pill.accent{background:var(--accent-soft);color:#7A5000}
.pill.plum{background:var(--plum-soft);color:var(--plum)}
:root[data-theme="dark"] .pill.accent{color:var(--accent)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .pill.accent{color:var(--accent)} }
.pill.cook{background:var(--ink);color:var(--bg)}
.meal .more{border:0;background:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ink-3);flex:none}
.meal .more:hover{background:var(--surface-2);color:var(--ink)}
.meal .done{position:absolute;left:52px;top:8px;width:20px;height:20px;border-radius:50%;background:var(--leaf);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 2px var(--surface)}
.meal .done svg.ic{width:13px;height:13px;stroke-width:3}

@media (min-width:900px){
  .daystrip{display:none}
  .board{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
  .board .day{padding:0}
  .board .dayhead{flex-direction:column;align-items:flex-start;gap:0;margin-bottom:8px}
  .board .dayhead h2{font-size:1.15rem}
  .board .dayhead .notebtn{margin-left:0;max-width:100%;padding-left:0}
  .board .meal{flex-direction:column;align-items:stretch;padding:10px;min-height:0;gap:8px}
  .board .meal .open{flex-direction:column;align-items:stretch;gap:8px}
  .board .tile{width:100%;height:86px;border-radius:12px;font-size:2.2rem}
  .board .meal .more{position:absolute;right:6px;top:6px;background:rgba(255,255,255,.75);color:var(--ink);width:30px;height:30px}
  :root[data-theme="dark"] .board .meal .more{background:rgba(0,0,0,.4)}
  .board .meal.empty{min-height:120px;flex-direction:column;justify-content:center;text-align:center;font-size:.86rem}
  .board .meal .done{left:auto;right:8px;top:70px}
  .board .meal .slotname{margin-top:2px}
  .board .meal .name{font-size:.95rem;overflow-wrap:break-word;hyphens:auto}
  .planbar{max-width:460px}
  .dayhead .notebtn{opacity:.55} .day:hover .notebtn,.dayhead .notebtn.has{opacity:1}
}

/* ---------- lists / cards ---------- */
.toolbar{display:flex;flex-direction:column;gap:10px;margin:4px 0 14px}
.search{width:100%;padding:12px 14px 12px 42px;border:0;border-radius:14px;background:var(--surface);box-shadow:var(--shadow-1)}
.searchwrap{position:relative}
.searchwrap svg.ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:700;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:600px){ .grid{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (min-width:1100px){ .grid{grid-template-columns:repeat(4,minmax(0,1fr))} }
.card{background:var(--surface);border-radius:18px;padding:8px;box-shadow:var(--shadow-1);border:0;text-align:left;display:flex;flex-direction:column;gap:8px;transition:transform .12s ease;position:relative}
.card:active{transform:scale(.98)}
.card .tile{width:100%;height:110px;border-radius:13px;font-size:2.6rem}
.card .name{font-weight:700;line-height:1.25;overflow-wrap:anywhere;padding:0 4px}
.card .meta{color:var(--ink-2);font-size:.8rem;padding:0 4px 4px}
.card .heart{position:absolute;top:14px;right:14px;color:var(--accent);filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
.card.selected{outline:3px solid var(--accent);outline-offset:-3px}
.card .selbox{position:absolute;top:14px;left:14px;width:26px;height:26px;border-radius:50%;background:var(--surface);display:grid;place-items:center;box-shadow:var(--shadow-1);color:var(--ink-3)}
.card.selected .selbox{background:var(--accent);color:var(--accent-ink)}
.selbar{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));z-index:24;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
@media (min-width:900px){ .selbar{left:220px} }
.empty{padding:34px 16px;color:var(--ink-2);text-align:center;background:var(--surface);border-radius:18px}
.empty h3{font-family:var(--display);color:var(--ink);margin:0 0 4px}
.empty p{margin:0 0 12px}

.listrow{display:flex;align-items:center;gap:12px;padding:8px 6px;border-radius:14px;border:0;background:none;width:100%;text-align:left}
.listrow:hover{background:var(--surface-2)}
.listrow .txt{flex:1;min-width:0}
.listrow .txt b{display:block;font-size:1rem}
.listrow .txt span{color:var(--ink-2);font-size:.82rem}
.listrow .kc{color:var(--ink-2);font-size:.82rem;white-space:nowrap}
.listrow.sel{background:var(--accent-soft)}
.sechead{font-family:var(--display);font-weight:700;font-size:.95rem;color:var(--ink-2);margin:14px 6px 4px}

/* ---------- shop ---------- */
.shopsec{background:var(--surface);border-radius:18px;padding:6px 10px;box-shadow:var(--shadow-1);margin-bottom:10px}
.shopsec h3{font-family:var(--display);font-size:1rem;margin:8px 6px 4px;color:var(--ink-2);display:flex;justify-content:space-between}
.shopitem{display:flex;align-items:center;gap:12px;padding:8px 6px;border-radius:12px;border:0;background:none;width:100%;text-align:left}
.shopitem .box{width:24px;height:24px;border-radius:8px;border:2px solid var(--line-2);display:grid;place-items:center;flex:none;transition:all .12s}
.shopitem .box svg.ic{width:14px;height:14px;stroke:#fff;stroke-width:3;opacity:0}
.shopitem.done .box{background:var(--leaf);border-color:var(--leaf)}
.shopitem.done .box svg.ic{opacity:1}
.shopitem .txt{flex:1;min-width:0}
.shopitem .txt b{font-weight:600}
.shopitem.done .txt b{text-decoration:line-through;color:var(--ink-3)}
.shopitem .txt span{color:var(--ink-3);font-size:.8rem;display:block}
.shopitem .del{border:0;background:none;color:var(--ink-3);width:32px;height:32px;border-radius:8px;display:grid;place-items:center}
.addline{display:flex;gap:8px;margin:10px 0}
.addline input{flex:1;padding:11px 14px;border:0;border-radius:14px;background:var(--surface);box-shadow:var(--shadow-1)}
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:8px 0 14px}
.progress i{display:block;height:100%;background:var(--leaf);transition:width .3s ease}

/* ---------- history ---------- */
.shelf{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:4px 2px 8px;margin:0 -2px}
.shelf::-webkit-scrollbar{display:none}
.shelf .card{width:140px;flex:none}
.shelf .card .tile{height:90px}

.month .mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.month .wd{text-align:center;font-size:.72rem;color:var(--ink-3);font-weight:700}
.month .mday{aspect-ratio:1/1.05;border-radius:10px;border:0;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:4px 2px;font-size:.78rem;color:var(--ink-2);gap:2px}
.month .mday.out{opacity:.35}
.month .mday.today{outline:2px solid var(--accent);outline-offset:-2px}
.month .mday .em{font-size:.95rem;line-height:1;display:flex;gap:1px;flex-wrap:wrap;justify-content:center}
.hweek{background:var(--surface);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow-1);margin:10px 0}
.hweek h3{font-family:var(--display);font-size:1.1rem;margin:0}
.hweek .range{color:var(--ink-2);font-size:.86rem}
.hweek ul{margin:8px 0 10px;padding-left:18px;font-size:.92rem}
.h2{font-family:var(--display);font-weight:800;font-size:1.2rem;letter-spacing:-.02em;margin:18px 0 8px}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,16,12,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}

.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line-2);margin:8px auto 0}
@media (min-width:700px){ .scrim{align-items:center;padding:20px} .sheet{border-radius:24px;max-height:88vh} .sheet .grab{display:none} }
.sheethead{display:flex;align-items:flex-start;gap:10px;padding:14px 18px 6px}
.sheethead h2{flex:1;font-family:var(--display);font-weight:800;font-size:1.3rem;letter-spacing:-.02em;margin:0;line-height:1.2}
.sheethead .sub{color:var(--ink-2);font-size:.88rem;font-family:var(--body);font-weight:500;display:block;margin-top:2px}
.sheetbody{overflow:auto;padding:4px 18px 16px;flex:1;overscroll-behavior:contain}
.sheetfoot{display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line)}
.close{border:0;background:var(--surface-2);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--ink-2)}
.actionlist button,.actionlist label.filebtn{display:grid;grid-template-columns:22px 1fr;column-gap:14px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:14px 8px;border-radius:14px;font-weight:600;font-size:1rem}

.actionlist button:hover{background:var(--surface-2)}
.actionlist button svg.ic{color:var(--ink-2)}
.actionlist button.danger{color:var(--danger)}

.actionlist .sub{display:block;grid-column:2;font-size:.82rem;color:var(--ink-2);font-weight:500}

.hero{display:flex;gap:14px;align-items:center;margin:6px 0 10px}
.hero .tile{width:84px;height:84px;border-radius:20px;font-size:2.6rem}
.hero .t{flex:1;min-width:0}
.hero .pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.nut{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 4px}
.nut div{background:var(--surface-2);border-radius:12px;padding:8px;text-align:center}
.nut b{display:block;font-family:var(--display);font-size:1.25rem;line-height:1.1}
.nut span{font-size:.74rem;color:var(--ink-2)}
.hint{color:var(--ink-2);font-size:.84rem}
.detail h3{font-family:var(--display);font-size:1.05rem;margin:18px 0 6px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.detail ul{padding-left:20px;margin:0}
.detail ol{padding-left:22px;margin:0}
.detail ol li{margin-bottom:8px}
.detail .note{background:var(--accent-soft);border-radius:14px;padding:10px 12px;margin-top:14px}
.stepper{display:inline-flex;align-items:center;gap:4px;background:var(--surface-2);border-radius:999px;padding:2px}
.stepper button{border:0;background:var(--surface);width:30px;height:30px;border-radius:50%;font-weight:700;box-shadow:var(--shadow-1)}
.stepper b{min-width:62px;text-align:center;font-size:.9rem}
.logline{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--line);font-size:.9rem}
.logline .d{color:var(--ink-3);white-space:nowrap;font-size:.82rem;padding-top:2px}

form.edit label{display:block;font-weight:700;font-size:.9rem;margin:12px 0 4px}
form.edit input[type=text],form.edit input[type=number],form.edit input[type=email],form.edit input[type=password],form.edit select,form.edit textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
form.edit textarea{min-height:100px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px 6px;font-weight:700;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.toggles{display:flex;gap:6px;flex-wrap:wrap}
.toggles button{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.85rem;color:var(--ink-2)}
.toggles button[aria-pressed="true"]{background:var(--leaf);color:#fff;border-color:var(--leaf)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.sw b{display:block}
.sw span{color:var(--ink-2);font-size:.84rem}
.switch{width:50px;height:30px;border-radius:15px;border:0;background:var(--line-2);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch[aria-checked="true"]{background:var(--leaf)}
.switch[aria-checked="true"]::after{left:23px}
.thinking{display:flex;align-items:center;gap:10px;color:var(--ink-2);padding:16px 0}
.spin{width:18px;height:18px;border:2.5px solid var(--line-2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.banner{padding:10px 14px;border-radius:14px;background:var(--accent-soft);font-size:.9rem;margin:10px 0}
.banner.err{background:var(--danger-soft)}
.filebtn{position:relative;overflow:hidden}

.photo-preview{width:100%;max-height:220px;object-fit:cover;border-radius:14px;margin-top:10px}

/* ---------- cook mode ---------- */
.cookmode{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.cookmode .ch h2{flex:1;font-family:var(--display);font-size:1.15rem;margin:0;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cookmode .prog{height:5px;background:var(--line);max-width:728px;margin:4px auto 0;width:calc(100% - 32px);border-radius:3px;overflow:hidden}
.cookmode .prog i{display:block;height:100%;background:var(--accent);transition:width .25s ease}
.cookmode .cb{flex:1;overflow:auto;padding:16px;max-width:760px;width:100%;margin:0 auto}
.cookmode .stepn{color:var(--ink-2);font-weight:700;font-size:.9rem}
.cookmode .step{font-family:var(--display);font-weight:500;font-size:clamp(1.5rem,4.6vw,2.2rem);line-height:1.3;letter-spacing:-.01em;margin:6px 0 18px}
.cookmode .timers{display:flex;flex-wrap:wrap;gap:8px}
.timerchip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;display:inline-flex;gap:8px;align-items:center}
.timerchip.run{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.timerchip.over{background:var(--danger);color:#fff;border-color:var(--danger);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.cookmode .ingl{list-style:none;padding:0;margin:0}
.cookmode .ingl li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:1.05rem}
.cookmode .ingl li .box{width:24px;height:24px;border-radius:8px;border:2px solid var(--line-2);flex:none;margin-top:3px;display:grid;place-items:center}
.cookmode .ingl li.done .box{background:var(--leaf);border-color:var(--leaf)}
.cookmode .ingl li.done span{text-decoration:line-through;color:var(--ink-3)}
.cookmode .cf{display:flex;gap:8px;padding:10px 16px 12px;max-width:760px;width:100%;margin:0 auto;border-top:1px solid var(--line)}
.cookmode .cf .btn{flex:1;padding:14px}
.cookmode .tabs{display:flex;gap:6px;padding:0 16px 6px;max-width:760px;width:100%;margin:0 auto}
.cookmode .tabs button{border:0;background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.86rem;color:var(--ink-2)}
.cookmode .tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.rate{text-align:center;padding:30px 10px}
.rate h3{font-family:var(--display);font-size:1.6rem;margin:0 0 6px}
.rate .thumbs{display:flex;gap:12px;justify-content:center;margin:18px 0}
.rate .thumbs button{width:84px;height:84px;border-radius:24px;border:2px solid var(--line-2);background:var(--surface);font-size:2rem}
.rate .thumbs button[aria-pressed="true"]{border-color:var(--leaf);background:var(--leaf-soft)}
.rate textarea{width:100%;min-height:80px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}

/* ---------- sign-in ---------- */
.signin{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px}
.signin .cardw{background:var(--surface);border-radius:24px;padding:26px 24px;max-width:380px;width:100%;box-shadow:var(--shadow-2)}
.signin .big{font-size:3rem;text-align:center;line-height:1}
.signin h2{font-family:var(--display);font-size:1.5rem;margin:8px 0 4px;text-align:center;letter-spacing:-.02em}
.signin p{color:var(--ink-2);text-align:center;margin:0 0 10px}
a.btn{text-decoration:none;color:var(--ink)}

/* ---------- walkthrough / toast ---------- */
.walk{position:fixed;inset:0;z-index:60;background:rgba(10,16,12,.62);display:flex;align-items:center;justify-content:center;padding:20px}
.walk .cardw{background:var(--surface);border-radius:24px;padding:26px 24px 20px;max-width:380px;width:100%;text-align:center;box-shadow:var(--shadow-2)}
.walk .big{font-size:3rem;line-height:1}
.walk h2{font-family:var(--display);font-size:1.4rem;margin:12px 0 6px;letter-spacing:-.02em}
.walk p{color:var(--ink-2);margin:0 0 18px}
.walk .dotsw{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
.walk .dotsw i{width:6px;height:6px;border-radius:50%;background:var(--line-2)}
.walk .dotsw i.on{background:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 12px 10px 16px;border-radius:14px;z-index:35;font-size:.92rem;max-width:min(92vw,520px);display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-2)}
.toast span{flex:1}
.toast button{border:0;flex:none;background:rgba(255,255,255,.15);color:inherit;font-weight:700;padding:6px 12px;border-radius:10px}
:root[data-theme="dark"] .toast button{background:rgba(0,0,0,.2)}
.skel{height:76px;border-radius:18px;background:linear-gradient(90deg,var(--surface) 25%,var(--surface-2) 50%,var(--surface) 75%);background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:8px}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){ *{animation:none !important;transition:none !important} }
@media (prefers-reduced-motion:no-preference){ .sheet{animation:up .22s cubic-bezier(.2,.8,.2,1)} @keyframes up{from{transform:translateY(24px);opacity:.5}to{transform:none;opacity:1}} .cookmode{animation:fade .18s ease} @keyframes fade{from{opacity:0}to{opacity:1}} }

</style>

<div class="shell">

<script>
(function(){
"use strict";
/* ============================================================
   Our Kitchen — family meal planner
   ============================================================ */
const DAY_SHORT=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DAY_LONG=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONTHS_LONG=["January","February","March","April","May","June","July","August","September","October","November","December"];
const SLOT_DEFS={breakfast:"Breakfast",lunch:"Lunch",dinner:"Dinner"};
const CUISINES=["Nepali","Western","Indian","Asian","Other"];
const DEFAULT_PANTRY=["salt","pepper","oil","rice","dal","lentils","turmeric","cumin","coriander powder","garam masala","chilli powder","sugar","flour","ghee","soy sauce","vinegar","stock cube","dried herbs","oregano","thyme","paprika","mustard"];
const DEFAULT_SETTINGS={weekStart:0,slots:{breakfast:false,lunch:true,dinner:true},vegDays:[],cooks:[],pantry:DEFAULT_PANTRY,noRepeatWeeks:3,newPerWeek:1,servings:4};

const S={
  db:null,auth:null,user:null,ready:false,live:false,online:navigator.onLine!==false,installPrompt:null,

};

/* ---------- small helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const sod=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const parseIso=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const fmt=d=>`${d.getDate()} ${MONTHS[d.getMonth()]}`;
const slug=s=>(s||"dish").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40)||"dish";
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function weekStartOf(d){const x=sod(d);const off=(x.getDay()-S.settings.weekStart+7)%7;return addDays(x,-off)}
function defaultWeekId(){
  const t=sod(new Date()),dow=t.getDay();
  const late=dow===5||dow===6||(S.settings.weekStart===1&&dow===0);
  return iso(late?addDays(weekStartOf(t),7):weekStartOf(t));
}

  const diff=Math.round((parseIso(id)-weekStartOf(new Date()))/(7*864e5));
  if(diff===0)return "This week";if(diff===1)return "Next week";if(diff===-1)return "Last week";

}
const enabledSlots=()=>Object.keys(SLOT_DEFS).filter(k=>S.settings.slots?.[k]);
function slotLabel(day,slot,weekId){
  if(day==null)return "Not placed";
  const d=addDays(parseIso(weekId||S.weekId),day);
  return `${DAY_LONG[d.getDay()]} ${SLOT_DEFS[slot]?.toLowerCase()||""}`.trim();
}
function hash(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)}
const TILES=[["#FFE3C2","#FFC48A"],["#DDF3E4","#A9DEBB"],["#E3E9FF","#B9C8FF"],["#FDE2E4","#F7B9C0"],["#F3E8FF","#D5BCF3"],["#DDF2F5","#A9DEE6"],["#FFF4C7","#FFE07A"],["#EAF2D9","#C8E09C"]];
const TILES_D=[["#4A3416","#6B4A1E"],["#1D3A27","#2B5538"],["#22304F","#2F4475"],["#4A2228","#6B2E38"],["#372547","#53386B"],["#1E3A40","#2B5560"],["#45390F","#6B5A16"],["#2D3A1B","#465A27"]];
function emojiFor(r){
  if(r.emoji)return r.emoji;
  const n=(r.name||"").toLowerCase();
  const map=[["momo","🥟"],["dumpling","🥟"],["pizza","🍕"],["burger","🍔"],["taco","🌮"],["fajita","🌮"],["burrito","🌯"],["wrap","🌯"],["sandwich","🥪"],["toast","🍞"],["bread","🍞"],["pasta","🍝"],["spaghetti","🍝"],["lasagn","🍝"],["noodle","🍜"],["chowmein","🍜"],["thukpa","🍜"],["ramen","🍜"],["soup","🍲"],["stew","🍲"],["curry","🍛"],["dal","🍛"],["rajma","🍛"],["chana","🍛"],["biryani","🍛"],["pulao","🍚"],["rice","🍚"],["khichdi","🍚"],["chiura","🍚"],["salmon","🐟"],["fish","🐟"],["prawn","🍤"],["shrimp","🍤"],["salad","🥗"],["chicken","🍗"],["roast","🍗"],["steak","🥩"],["beef","🥩"],["lamb","🥩"],["mutton","🥩"],["pork","🥓"],["egg","🍳"],["omelette","🍳"],["paratha","🫓"],["roti","🫓"],["naan","🫓"],["pancake","🥞"],["potato","🥔"],["aloo","🥔"],["saag","🥬"],["spinach","🥬"],["gobi","🥦"],["cauliflower","🥦"],["broccoli","🥦"],["mushroom","🍄"],["pie","🥧"],["cheese","🧀"],["tomato","🍅"],["bean","🫘"],["paneer","🧀"],["tofu","🍢"],["porridge","🥣"],["cereal","🥣"],["sel","🍩"]];

}
function tileHtml(r,cls=""){
  const dark=matchMedia("(prefers-color-scheme: dark)").matches&&document.documentElement.dataset.theme!=="light"||document.documentElement.dataset.theme==="dark";
  const pal=(dark?TILES_D:TILES)[hash(r.id||r.name)%TILES.length];
  const style=`background:linear-gradient(135deg,${pal[0]},${pal[1]})`;
  if(r.photoData)return `<div class="tile ${cls}" style="${style}"><img src="${esc(r.photoData)}" alt="" loading="lazy"></div>`;
  return `<div class="tile ${cls}" style="${style}" aria-hidden="true">${emojiFor(r)}</div>`;
}
/* icons */
const ICONS={
  cal:'<rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
  cart:'<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/>',
  clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  history:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 3"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  x:'<path d="M18 6L6 18M6 6l12 12"/>',
  left:'<path d="M15 18l-6-6 6-6"/>',
  right:'<path d="M9 18l6-6-6-6"/>',

/* ---------- parsing: quantities, ingredients, durations ---------- */
const UNITS=["kg","g","ml","l","litre","litres","liter","liters","cups","cup","tbsp","tsp","tablespoons","tablespoon","teaspoons","teaspoon","tins","tin","cans","can","cloves","clove","slices","slice","heads","head","handfuls","handful","bunches","bunch","pinch","packs","pack","packets","packet","pieces","piece","sticks","stick","sprigs","sprig","lb","oz","sheets","sheet","rashers","rasher","fillets","fillet","breasts","breast","thighs","thigh"];
const FRAC={"½":.5,"¼":.25,"¾":.75,"⅓":1/3,"⅔":2/3,"⅛":.125};
const NUM_RE=/^(\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:[.,]\d+)?|[½¼¾⅓⅔⅛])(?:\s*(?:[–-]|to)\s*(\d+\/\d+|\d+(?:[.,]\d+)?|[½¼¾⅓⅔⅛]))?/;
function parseNum(s){
  if(!s)return null;s=s.trim();

  if(/^\d+\s+\d+\/\d+$/.test(s)){const [a,b]=s.split(/\s+/);const [n,d]=b.split("/");return +a+(+n)/(+d)}
  if(/^\d+\/\d+$/.test(s)){const [n,d]=s.split("/");return (+n)/(+d)}
  return parseFloat(s.replace(",","."));
}
function fmtNum(n){
  if(n==null||!isFinite(n))return "";
  const whole=Math.floor(n),rem=n-whole;
  const fr=[[.25,"¼"],[1/3,"⅓"],[.5,"½"],[2/3,"⅔"],[.75,"¾"]];
  for(const [v,s] of fr)if(Math.abs(rem-v)<.06)return (whole?whole+" ":"")+s;
  if(rem<.06)return String(whole);
  return (Math.round(n*10)/10).toString();
}
function parseIngredient(line){
  let s=line.trim();
  let qty=null,qtyEnd=null,unit="";
  const m=s.match(NUM_RE);
  if(m){qty=parseNum(m[1]);qtyEnd=m[2]!=null?parseNum(m[2]):null;s=s.slice(m[0].length).trim()}
  const um=s.match(new RegExp("^("+UNITS.join("|")+")\\b\\.?\\s*","i"));
  if(um){unit=um[1].toLowerCase();s=s.slice(um[0].length)}
  s=s.replace(/^of\s+/i,"");
  let name=s.split(/,|\(|\bfor\b|\bto serve\b|\bor\b/i)[0].trim();
  name=name.replace(/\b(finely|roughly|thinly|chopped|diced|sliced|crushed|grated|minced|peeled|halved|cut|large|small|medium|fresh|ripe|boneless|skinless|cooked|frozen|whole|plain|dried|ground|in chunks|shaved)\b/gi,"").replace(/\s+/g," ").trim();
  if(!name)name=s.trim()||line.trim();
  return {qty,qtyEnd,unit:normUnit(unit),name,raw:line.trim()};
}
function normUnit(u){
  const m={tablespoons:"tbsp",tablespoon:"tbsp",teaspoons:"tsp",teaspoon:"tsp",cups:"cup",tins:"tin",cans:"tin",can:"tin",cloves:"clove",slices:"slice",heads:"head",handfuls:"handful",bunches:"bunch",packs:"pack",packets:"pack",packet:"pack",pieces:"piece",sticks:"stick",sprigs:"sprig",litre:"l",litres:"l",liter:"l",liters:"l",sheets:"sheet",rashers:"rasher",fillets:"fillet",breasts:"breast",thighs:"thigh"};
  return m[u]||u;
}
function singular(w){
  w=w.toLowerCase().trim();
  if(w.length<5)return w;
  if(/(ss|us|is)$/.test(w))return w;
  if(/oes$/.test(w))return w.slice(0,-2);
  if(/ies$/.test(w))return w.slice(0,-3)+"y";
  if(/(ches|shes|xes|sses)$/.test(w))return w.slice(0,-2);
  if(/s$/.test(w))return w.slice(0,-1);
  return w;
}
const ingKey=p=>singular(p.name).replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ").trim();
const SECTIONS=[
  ["Fruit & veg",["onion","garlic","ginger","tomato","potato","carrot","pepper","capsicum","lettuce","lemon","lime","spinach","saag","mushroom","courgette","zucchini","pea","spring onion","coriander","chilli","chili","cucumber","cabbage","cauliflower","gobi","broccoli","bean","corn","celery","avocado","apple","banana","orange","mango","herb","basil","parsley","mint","leek","pumpkin","squash","aubergine","eggplant","radish","beetroot","fruit","vegetable","salad","rocket","kale","sprout","mushroom","bamboo","tama"]],
  ["Meat & fish",["chicken","beef","lamb","mutton","mince","pork","bacon","salmon","fish","prawn","shrimp","tuna","sausage","turkey","meat","goat","buff","duck"]],
  ["Dairy & eggs",["milk","butter","cheese","cream","yoghurt","yogurt","dahi","parmesan","cheddar","mozzarella","paneer","egg","ghee"]],
  ["Bakery",["bread","bun","tortilla","roti","naan","pitta","pita","wrap","crumb","pastry","croissant"]],
  ["Frozen",["frozen","ice cream"]],

function sectionFor(name){const n=name.toLowerCase();for(const [sec,words] of SECTIONS)if(words.some(w=>n.includes(w)))return sec;return "Pantry & other"}
const SECTION_ORDER=["Fruit & veg","Meat & fish","Dairy & eggs","Bakery","Frozen","Pantry & other","Extras"];
function inPantry(name){const n=name.toLowerCase();return (S.settings.pantry||[]).some(p=>p&&n.includes(p.toLowerCase()))}

function scaleLine(line,f){
  if(!f||f===1)return line;
  let out=line.replace(/^(\s*)(\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:[.,]\d+)?|[½¼¾⅓⅔⅛])(\s*(?:[–-]|to)\s*(\d+\/\d+|\d+(?:[.,]\d+)?|[½¼¾⅓⅔⅛]))?/,(m,sp,a,range,b)=>{
    const A=fmtNum(parseNum(a)*f);return sp+(range?`${A}–${fmtNum(parseNum(b)*f)}`:A)});
  out=out.replace(/\((\d+(?:[.,]\d+)?)\s*(g|kg|ml|l|oz|lb|cup|cups)\)/gi,(m,n,u)=>`(${fmtNum(parseFloat(n.replace(",","."))*f)} ${u})`);
  return out;
}
function durationsIn(text){
  const out=[];const re=/(\d+)(?:\s*(?:[–-]|to)\s*(\d+))?\s*(hours?|hrs?|h\b|minutes?|mins?|seconds?|secs?)(?:\s+(?:and\s+)?(\d+)\s*(minutes?|mins?))?/gi;
  let m;while((m=re.exec(text))){
    let n=+m[1];const u=m[3].toLowerCase();let secs=/^h/.test(u)?n*3600:/^s/.test(u)?n:n*60;
    if(m[4]&&/^h/.test(u))secs+=(+m[4])*60;
    if(secs>=30&&secs<=6*3600&&!out.some(o=>o.secs===secs))out.push({secs,label:m[0].trim()});
  }
  return out.slice(0,3);
}
const fmtClock=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}:${String(m).padStart(2,"0")}:${String(x).padStart(2,"0")}`:`${m}:${String(x).padStart(2,"0")}`};

const weekDoc=id=>S.weeks.get(id)||{};
const weekItems=id=>(weekDoc(id).items)||[];
function recipeMeals(r){return r.meals&&r.meals.length?r.meals:["lunch","dinner"]}
function historyIndex(){
  const today=sod(new Date());const last=new Map(),next=new Map(),count=new Map();
  for(const [id,w] of S.weeks){
    const ws=parseIso(id);
    for(const it of (w.items||[])){
      const d=it.day!=null?addDays(ws,it.day):addDays(ws,6);
      if(d<=today){const p=last.get(it.rid);if(!p||d>p)last.set(it.rid,d);count.set(it.rid,(count.get(it.rid)||0)+1)}
      else{const p=next.get(it.rid);if(!p||d<p)next.set(it.rid,d)}
    }
  }
  return {last,next,count};
}
const daysSince=d=>Math.round((sod(new Date())-d)/864e5);
function lastLabel(rid,H){
  const d=H.last.get(rid);
  if(!d)return H.next.get(rid)?"Planned":"New to us";
  const n=daysSince(d);
  if(n===0)return "Today";if(n===1)return "Yesterday";if(n<7)return `${n} days ago`;
  const w=Math.round(n/7);if(w<9)return `${w} week${w>1?"s":""} ago`;
  return `${Math.round(n/30)} months ago`;
}
const ratingScore=r=>((r.rating?.up||0)-(r.rating?.down||0));
function sortedRecipes(){return [...S.recipes.values()].sort((a,b)=>a.name.localeCompare(b.name))}
function matches(r,filter,q,H){
  if(q&&!(r.name+" "+(r.alias||"")).toLowerCase().includes(q.toLowerCase()))return false;
  switch(filter){
    case "staple":return r.kind!=="full";
    case "full":return r.kind==="full";
    case "fav":return !!r.fav;
    case "veg":return !!r.veg;
    case "quick":return r.minutes>0&&r.minutes<=30;
    case "Nepali":case "Western":return r.cuisine===filter;
    case "lately":{const d=H.last.get(r.id);return !d||daysSince(d)>=28}
    case "breakfast":return recipeMeals(r).includes("breakfast");
  }
  return true;
}
const FILTERS=[["all","All"],["staple","Staples"],["full","Recipes"],["fav","Favourites"],["veg","Veg"],["quick","Quick"],["lately","Not lately"],["Nepali","Nepali"],["Western","Western"]];

function weekBalance(id){
  const items=weekItems(id).filter(i=>i.day!=null);
  const H=historyIndex();
  const days={};let newDishes=0,quick=0,protein=[],vegDays=0,meatDays=0;
  for(const it of items){const r=S.recipes.get(it.rid);if(!r)continue;(days[it.day]=days[it.day]||[]).push(r);
    if(r.kcal)protein.push(r.protein||0);
    if(!H.count.get(it.rid)&&r.kind==="full")newDishes++;
    if(r.minutes&&r.minutes<=30)quick++;}
  const dayK=Object.values(days).map(rs=>rs.reduce((a,r)=>a+(r.kcal||0),0)).filter(k=>k>0);
  const avgK=dayK.length?Math.round(dayK.reduce((a,b)=>a+b,0)/dayK.length):0;
  const dayP=Object.values(days).map(rs=>rs.reduce((a,r)=>a+(r.protein||0),0)).filter(k=>k>0);
  const avgP=dayP.length?Math.round(dayP.reduce((a,b)=>a+b,0)/dayP.length):0;
  for(const rs of Object.values(days)){if(rs.every(r=>r.veg))vegDays++;else meatDays++}
  return {meals:items.length,dishes:new Set(items.map(i=>i.rid)).size,avgK,avgP,newDishes:new Set(items.filter(i=>!H.count.get(i.rid)&&S.recipes.get(i.rid)?.kind==="full").map(i=>i.rid)).size,quick,vegDays,meatDays,daysPlanned:Object.keys(days).length};
}

const chains=new Map();
function queued(path,fn){const p=(chains.get(path)||Promise.resolve()).then(fn,fn);chains.set(path,p.catch(()=>{}));return p}
function handleWriteError(e){

  else toast("Couldn’t save that change. It will retry when you’re back online.");
}

function removeItem(itemId){const r=S.recipes.get(weekItems(S.weekId).find(i=>i.id===itemId)?.rid);setItems(weekItems(S.weekId).filter(i=>i.id!==itemId),`Removed ${r?r.name:"dish"}`)}

  const target=items.find(i=>i.day===day&&i.slot===slot&&i.id!==itemId);

}

/* ---------- plan my week ---------- */
function planWeek(mode){
  const st=S.settings;const H=historyIndex();const ws=parseIso(S.weekId);
  let items=mode==="fresh"?[]:[...weekItems(S.weekId)];
  const used=new Map();items.forEach(i=>used.set(i.rid,(used.get(i.rid)||0)+1));
  const recipes=[...S.recipes.values()];
  const noRepeatDays=(st.noRepeatWeeks||3)*7;
  const isVegDay=day=>(st.vegDays||[]).includes(addDays(ws,day).getDay());
  const isWeekend=day=>[0,6].includes(addDays(ws,day).getDay());
  const slotsOrder=[];for(const slot of ["dinner","lunch","breakfast"])if(st.slots?.[slot])for(let d=0;d<7;d++)slotsOrder.push([d,slot]);
  const dayCuisine={};items.forEach(i=>{const r=S.recipes.get(i.rid);if(r&&i.day!=null)dayCuisine[i.day]=r.cuisine});
  const place=(d,slot,r)=>{items.push({id:uid(),rid:r.id,day:d,slot});used.set(r.id,(used.get(r.id)||0)+1);dayCuisine[d]=r.cuisine;if(r.kind==="full"&&!H.count.get(r.id))newCount++};
  let newCount=0;
  /* new dishes first */
  let wantNew=st.newPerWeek||0;
  const fresh=recipes.filter(r=>r.kind==="full"&&!H.count.get(r.id)&&!used.has(r.id)).sort(()=>Math.random()-.5);
  for(const [d,slot] of slotsOrder.filter(([d,s])=>s==="dinner"&&isWeekend(d)).concat(slotsOrder.filter(([d,s])=>s==="dinner"&&!isWeekend(d)))){
    if(wantNew<=0)break;if(items.some(i=>i.day===d&&i.slot===slot))continue;
    const pick=fresh.find(r=>!used.has(r.id)&&(!isVegDay(d)||r.veg)&&recipeMeals(r).includes(slot));
    if(pick){place(d,slot,pick);wantNew--}
  }
  newCount=items.filter(i=>{const r=S.recipes.get(i.rid);return r&&r.kind==="full"&&!H.count.get(r.id)}).length;
  const score=(r,d,slot,relax)=>{
    if(!recipeMeals(r).includes(slot))return -1;
    if(isVegDay(d)&&!r.veg)return -1;
    const u=used.get(r.id)||0;
    if(u&&(r.kind==="full"||u>=2))return -1;
    const last=H.last.get(r.id);const since=last?daysSince(last):(r.kind==="full"?45:30);
    if(!relax&&last&&since<noRepeatDays)return -1;
    let s=40+Math.min(since,120)/2+(r.fav?12:0)+ratingScore(r)*8+Math.random()*25;
    if(u)s-=25;
    if(r.minutes>60&&!isWeekend(d))s-=35;
    if(r.minutes>45&&slot==="lunch")s-=12;
    if(r.minutes&&r.minutes<=30&&!isWeekend(d))s+=6;
    if(r.kind==="full"&&!H.count.get(r.id)&&newCount>=(st.newPerWeek||0))s-=30;
    if(dayCuisine[d]&&dayCuisine[d]===r.cuisine)s-=8;
    const prev=dayCuisine[d-1];if(prev&&prev===r.cuisine&&r.kind==="full")s-=6;
    return s;
  };
  for(const [d,slot] of slotsOrder){
    if(items.some(i=>i.day===d&&i.slot===slot))continue;
    let best=null,bs=-1;
    for(const relax of [false,true]){
      for(const r of recipes){const s=score(r,d,slot,relax);if(s>bs){bs=s;best=r}}
      if(best)break;
    }
    if(best)place(d,slot,best);
  }
  return items;
}

/* ---------- shopping ---------- */
function buildShopping(weekId){
  const items=weekItems(weekId).filter(i=>!i.leftover);
  const rids=[...new Set(items.map(i=>i.rid))];
  const merged=new Map();const pantry=[];
  for(const rid of rids){
    const r=S.recipes.get(rid);if(!r||!(r.ingredients||[]).length)continue;
    const uses=items.filter(i=>i.rid===rid).length;
    const f=(S.settings.servings&&r.servings)?S.settings.servings/r.servings:1;
    for(const line of r.ingredients){
      const p=parseIngredient(line);const key=ingKey(p);if(!key)continue;
      if(inPantry(p.name)){if(!pantry.some(x=>x.key===key))pantry.push({key,name:p.name,raw:p.raw});continue}
      const k2=key+"|"+p.unit;
      const e=merged.get(k2)||{key:k2,name:p.name,unit:p.unit,qty:0,hasQty:false,from:new Set(),raws:[]};
      if(p.qty!=null){e.qty+=p.qty*f*uses;e.hasQty=true}
      e.from.add(r.name);e.raws.push(p.raw);merged.set(k2,e);
    }
  }
  const groups={};
  for(const e of merged.values()){const sec=sectionFor(e.name);(groups[sec]=groups[sec]||[]).push(e)}
  for(const g of Object.values(groups))g.sort((a,b)=>a.name.localeCompare(b.name));
  return {groups,pantry,recipes:rids.map(id=>S.recipes.get(id)).filter(r=>r&&(r.ingredients||[]).length)};
}
const PLURAL_UNITS={cup:"cups",tin:"tins",clove:"cloves",slice:"slices",head:"heads",handful:"handfuls",bunch:"bunches",pack:"packs",piece:"pieces",stick:"sticks",sprig:"sprigs",sheet:"sheets",rasher:"rashers",fillet:"fillets",breast:"breasts",thigh:"thighs"};
const NO_PLURAL=["lettuce","broccoli","garlic","spinach","rice","fish","salmon","chicken","beef","lamb","mutton","pork","bread","cheese","butter","milk","cream","oil","flour","sugar","salt","pepper","corn","celery","cabbage","saag","mince","tuna","ginger","yoghurt","yogurt","dahi","paneer","tofu","pasta","spaghetti","water","stock","sauce","paste","honey","vinegar"];
function pluralName(n){const w=n.trim();const low=w.toLowerCase();if(!w||/s$/.test(low)||NO_PLURAL.some(x=>low.endsWith(x)))return w;if(/(o)$/.test(low)&&!/(oo|io)$/.test(low))return w+"es";if(/[^aeiou]y$/.test(low))return w.slice(0,-1)+"ies";if(/(ch|sh|x|z)$/.test(low))return w+"es";return w+"s"}
function shopLine(e){
  if(!e.hasQty)return e.name;
  const q=fmtNum(e.qty);const many=e.qty>1.05;
  const unit=e.unit?(many&&PLURAL_UNITS[e.unit]||e.unit):"";
  return `${q}${unit?" "+unit:""} ${!unit&&many?pluralName(e.name):e.name}`;
}

    const ws=parseIso(id);const items=weekItems(id);const byDay=[];
    for(let i=0;i<7;i++){const its=items.filter(x=>x.day===i);if(its.length)byDay.push(`<li><b>${DAY_SHORT[addDays(ws,i).getDay()]}:</b> ${its.map(x=>esc(S.recipes.get(x.rid)?.name||"deleted recipe")).join(", ")}</li>`)}
    h+=`<section class="hweek"><h3>${relWeek(id)}</h3><div class="range">${fmt(ws)} to ${fmt(addDays(ws,6))}</div><ul>${byDay.join("")}</ul><div class="row-actions"><button class="btn sm" data-goweek="${id}">Open</button>${id!==S.weekId?`<button class="btn sm soft" data-reuse="${id}">${ic("copy")} Copy into ${esc(relWeek(S.weekId).toLowerCase())}</button>`:""}</div></section>`;
  }
  return h;
}

/* ============================================================
   Sheets
   ============================================================ */
function openSheet(kind,opts={}){S.sheet={kind,...opts};$("#scrim").hidden=false;drawSheet();document.body.style.overflow="hidden"}
function closeSheet(){if(S.aiCtl){S.aiCtl.abort();S.aiCtl=null}S.sheet=null;$("#scrim").hidden=true;$("#sheet").innerHTML="";document.body.style.overflow=""}
function refreshSheet(){if(!S.sheet)return;if(S.sheet.kind==="pick")drawPickList();else if(["detail","itemmenu"].includes(S.sheet.kind)&&!S.sheet.busy)drawSheet()}
function head(title,sub){return `<div class="grab"></div><div class="sheethead"><h2>${title}${sub?`<span class="sub">${sub}</span>`:""}</h2><button class="close" data-act="close" aria-label="Close">${ic("x")}</button></div>`}

function drawSheet(){
  const s=S.sheet,el=$("#sheet");if(!s)return;
  const map={pick:pickHtml,itemmenu:itemMenuHtml,detail:detailHtml,edit:editHtml,newmenu:newMenuHtml,gpt:gptHtml,settings:settingsHtml,suggest:suggestHtml,weekmenu:weekMenuHtml,daynote:dayNoteHtml,slotpick:slotPickHtml,rate:rateHtml,mday:mdayHtml,autoplan:autoplanHtml,cooks:cooksHtml};
  el.innerHTML=(map[s.kind]||(()=>""))(s);
  if(s.kind==="pick")drawPickList();
  const f=el.querySelector("[data-autofocus]");if(f)setTimeout(()=>f.focus(),60);
}

/* ---- picker: tap a dish for a slot ---- */
function pickHtml(s){
  const title=s.day!=null?`${esc(slotLabel(s.day,s.slot))}`:"Add to the week";
  return head("Choose a dish",title)+`<div style="padding:0 18px 6px"><div class="searchwrap">${ic("search")}<input class="search" id="psearch" type="search" placeholder="Search" value="${esc(s.q||"")}" aria-label="Search" data-autofocus></div>
    <div class="chips" style="margin-top:8px">${FILTERS.map(([k,l])=>`<button class="chip" data-pfilter="${k}" aria-pressed="${(s.filter||"all")===k}">${l}</button>`).join("")}</div></div>
    <div class="sheetbody" id="plist"></div><div class="sheetfoot"><button class="btn soft" data-act="newmenu">${ic("plus")} New dish</button>${s.swap?`<button class="btn ghost" data-act="close">Keep it</button>`:""}</div>`;
}
function pickRow(r,H,s,extraCls=""){
  const meta=[r.kind==="full"?"Recipe":"Staple",lastLabel(r.id,H),r.minutes?`${r.minutes} min`:""].filter(Boolean).join(", ");
  return `<button class="listrow ${extraCls}" data-tick="${esc(r.id)}">${tileHtml(r,"sm")}<span class="txt"><b>${esc(r.name)}${r.veg?` <span class="pill leaf">Veg</span>`:""}</b><span>${esc(meta)}</span></span><span class="kc">${r.kcal?`~${r.kcal} kcal`:""}</span></button>`;
}
function drawPickList(){
  const s=S.sheet,box=$("#plist");if(!box||!s)return;
  const H=historyIndex();const q=s.q||"",f=s.filter||"all";
  let list=sortedRecipes().filter(r=>matches(r,f,q,H));
  if(s.slot&&!q&&f==="all")list=list.filter(r=>recipeMeals(r).includes(s.slot)||s.slot!=="breakfast");
  let h="";
  if(!q&&f==="all"&&list.length>6){
    const inWeek=new Set(weekItems(S.weekId).map(i=>i.rid));
    const ws=parseIso(S.weekId);const vegDay=s.day!=null&&(S.settings.vegDays||[]).includes(addDays(ws,s.day).getDay());
    const sugg=list.filter(r=>!inWeek.has(r.id)&&(!vegDay||r.veg)&&(!s.slot||recipeMeals(r).includes(s.slot))).map(r=>{const d=H.last.get(r.id);const since=d?daysSince(d):40;return {r,sc:(d&&since<21?-100:0)+since/2+(r.fav?10:0)+ratingScore(r)*6+Math.random()*10}}).sort((a,b)=>b.sc-a.sc).slice(0,4).map(x=>x.r);
    if(sugg.length)h+=`<div class="sechead">Good picks for this meal</div>`+sugg.map(r=>pickRow(r,H,s)).join("")+`<div class="sechead">All dishes</div>`;
  }
  h+=list.length?list.map(r=>pickRow(r,H,s)).join(""):`<div class="empty"><h3>Nothing matches</h3><p>${S.recipes.size?"Try another word or filter.":"Add your first dish below."}</p></div>`;
  box.innerHTML=h;
}

/* ---- item menu (long-press / ⋯) ---- */
function itemMenuHtml(s){
  const it=weekItems(S.weekId).find(i=>i.id===s.itemId);if(!it)return head("Already removed");
  const r=S.recipes.get(it.rid);const name=r?r.name:"Dish";
  const cooks=S.settings.cooks||[];
  return head(esc(name),esc(slotLabel(it.day,it.slot)))+`<div class="sheetbody actionlist">
    ${r?.kind==="full"?`<button data-cook="${esc(r.id)}" data-cookitem="${it.id}">${ic("flame")} Cook now<span class="sub">Step by step, with timers</span></button>`:""}
    ${r?`<button data-open="${esc(r.id)}">${ic("book")} View recipe</button>`:""}
    <button data-swapitem="${it.id}">${ic("swap")} Swap for another dish</button>
    <button data-moveitem="${it.id}">${ic("move")} Move to another meal</button>
    <button data-leftover="${it.id}">${ic("leftover")} ${it.leftover?"Not leftovers":"Mark as leftovers"}<span class="sub">${it.leftover?"Counts as cooking again":"Reheating something from earlier"}</span></button>
    <button data-cooks="${it.id}">${ic("chef")} Who’s cooking${it.cook?`<span class="sub">${esc(it.cook)}</span>`:cooks.length?"":`<span class="sub">Add the family’s names in Settings</span>`}</button>
    <button data-rateitem="${it.id}">${ic("thumbup")} ${it.cooked?"Rate it again":"Mark as cooked and rate"}</button>
    <button class="danger" data-remove="${it.id}">${ic("trash")} Remove from this day</button></div>`;
}
function cooksHtml(s){
  const it=weekItems(S.weekId).find(i=>i.id===s.itemId);if(!it)return head("Already removed");
  const cooks=S.settings.cooks||[];
  return head("Who’s cooking?",esc(S.recipes.get(it.rid)?.name||""))+`<div class="sheetbody"><div class="toggles" style="margin:8px 0 14px">${cooks.map(c=>`<button data-setcook="${esc(c)}" aria-pressed="${it.cook===c}">${esc(c)}</button>`).join("")}<button data-setcook="" aria-pressed="${!it.cook}">Nobody yet</button></div>
    <p class="hint">${cooks.length?"Change the names in Settings.":"Add the family’s names in Settings, then pick a cook here."}</p></div><div class="sheetfoot"><button class="btn ghost" data-act="settings">${ic("gear")} Settings</button></div>`;
}
function slotPickHtml(s){
  const ws=parseIso(S.weekId);const r=S.recipes.get(s.rid);const it=s.itemId?weekItems(S.weekId).find(i=>i.id===s.itemId):null;
  let h=head(s.itemId?"Move to":"Add to the week",esc(r?.name||""))+`<div class="sheetbody">`;
  for(let i=0;i<7;i++){const d=addDays(ws,i);h+=`<div class="sechead">${DAY_LONG[d.getDay()]} ${fmt(d)}</div><div class="row-actions" style="margin:0 6px 6px">`+enabledSlots().map(sl=>{const ex=itemAt(i,sl);const cur=it&&it.day===i&&it.slot===sl;const exr=ex?S.recipes.get(ex.rid):null;
      return `<button class="btn sm ${cur?"primary":ex?"soft":""}" data-slotpick="${i}:${sl}" ${cur?"disabled":""}>${SLOT_DEFS[sl]}${exr?`: ${esc(exr.name.length>18?exr.name.slice(0,17)+"…":exr.name)}`:""}</button>`}).join("")+`</div>`}
  return h+`</div>`;
}

/* ---- recipe detail ---- */
function detailHtml(s){
  const r=S.recipes.get(s.id);if(!r)return head("Recipe not found")+`<div class="sheetbody"><p>This recipe was deleted.</p></div>`;
  const H=historyIndex();const sv=s.servings||r.servings||S.settings.servings||4;const f=r.servings?sv/r.servings:1;
  const pills=[r.kind==="full"?`<span class="pill sky">Recipe</span>`:`<span class="pill">Staple</span>`,r.cuisine?`<span class="pill">${esc(r.cuisine)}</span>`:"",r.veg?`<span class="pill leaf">${ic("leaf")} Veg</span>`:"",r.minutes?`<span class="pill">${ic("clock")} ${r.minutes} min</span>`:"",ratingScore(r)>0?`<span class="pill accent">${ic("thumbup")} ${r.rating.up}</span>`:""].join("");
  const nut=(r.kcal||r.protein||r.carbs||r.fat)?`<div class="nut"><div><b>${r.kcal||"–"}</b><span>kcal</span></div><div><b>${r.protein??"–"}</b><span>protein g</span></div><div><b>${r.carbs??"–"}</b><span>carbs g</span></div><div><b>${r.fat??"–"}</b><span>fat g</span></div></div><p class="hint" style="margin:0">Per serving, rough estimate.</p>`:"";
  const log=(r.cooklog||[]).slice(-4).reverse();
  return head(esc(r.name))+`<div class="sheetbody detail">
    <div class="hero">${tileHtml(r)}<div class="t"><div class="hint">${esc(lastLabel(r.id,H))}${H.count.get(r.id)?`, cooked ${H.count.get(r.id)}×`:""}</div><div class="pills">${pills}</div></div></div>
    <div class="row-actions" style="margin:4px 0 6px">${r.kind==="full"?`<button class="btn primary" data-cook="${esc(r.id)}">${ic("flame")} Cook</button>`:""}<button class="btn" data-addweek="${esc(r.id)}">${ic("cal")} Add to week</button><button class="btn soft" data-fav="${esc(r.id)}" aria-pressed="${!!r.fav}" style="${r.fav?"color:var(--accent)":""}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="${r.fav?"fill:currentColor":""}">${ICONS.star}</svg> ${r.fav?"Favourite":"Add to favourites"}</button></div>
    ${nut}
    ${(r.ingredients||[]).length?`<h3>Ingredients ${r.servings?`<span class="stepper"><button data-serv="-1" aria-label="Fewer servings">−</button><b>Serves ${sv}</b><button data-serv="1" aria-label="More servings">+</button></span>`:""}</h3><ul>${r.ingredients.map(i=>`<li>${esc(scaleLine(i,f))}</li>`).join("")}</ul>`:""}
    ${(r.steps||[]).length?`<h3>Method</h3><ol>${r.steps.map(i=>`<li>${esc(i)}</li>`).join("")}</ol>`:""}
    ${r.notes?`<div class="note">${esc(r.notes)}</div>`:""}
    ${r.kind!=="full"&&!(r.ingredients||[]).length?`<p class="hint" style="margin-top:14px">A staple everyone knows. No instructions needed.</p>`:""}
    ${log.length?`<h3>Family notes</h3>${log.map(l=>`<div class="logline"><span class="d">${esc(l.date)}</span><span>${l.rating>0?"👍":l.rating<0?"👎":""} ${esc(l.note||"")}</span></div>`).join("")}`:""}
    </div>
    <div class="sheetfoot"><button class="btn soft" data-edit="${esc(r.id)}">${ic("edit")} Edit</button><label class="btn soft filebtn">${ic("camera")} ${r.photoData?"Change photo":"Add photo"}<input type="file" accept="image/*" capture="environment" data-photo="${esc(r.id)}"></label>${r.photoData?`<button class="btn ghost" data-rmphoto="${esc(r.id)}">Remove photo</button>`:""}<button class="btn ghost" data-rate="${esc(r.id)}">${ic("thumbup")} Rate</button></div>`;
}

    <div class="grid2"><div><label for="f-cuisine">Cuisine</label><select id="f-cuisine" name="cuisine">${CUISINES.map(c=>`<option ${r.cuisine===c?"selected":""}>${c}</option>`).join("")}</select></div>

}
function newMenuHtml(){
  return head("Add a dish")+`<div class="sheetbody actionlist">

const RECIPE_SHAPE=`{"name":string,"cuisine":"Western"|"Nepali"|"Indian"|"Asian"|"Other","veg":boolean,"minutes":number,"servings":number,"kcal":number,"protein":number,"carbs":number,"fat":number,"ingredients":[string],"steps":[string],"notes":string,"emoji":string}`;
const STARTERS=["dal-bhat-tarkari","chicken-curry-rice","mutton-curry-rice","aloo-gobi-roti","saag-dal-bhat","khichdi","chiura-aloo-tarkari","egg-curry-rice","veg-chowmein","chicken-momo","thukpa","aloo-paratha","rajma-rice","chana-masala-roti","fish-curry-rice","aloo-tama-bodi","spaghetti-bolognese","shepherds-pie","baked-salmon-veg","chicken-fajitas","creamy-mushroom-pasta","roast-chicken-potatoes","tomato-soup-grilled-cheese","chicken-caesar-salad","beef-burgers-wedges","veg-fried-rice-omelette"];
function recipePreview(r){
  return `<div class="detail" style="margin-top:12px;border-top:1px solid var(--line);padding-top:8px"><div class="hero">${tileHtml(r)}<div class="t"><h3 style="margin:0;font-size:1.25rem">${esc(r.name)}</h3><div class="hint">${esc([r.cuisine,r.veg?"vegetarian":"",r.minutes?r.minutes+" min":"",r.servings?"serves "+r.servings:""].filter(Boolean).join(", "))}</div></div></div>
    <div class="nut"><div><b>${r.kcal||"–"}</b><span>kcal</span></div><div><b>${r.protein??"–"}</b><span>protein g</span></div><div><b>${r.carbs??"–"}</b><span>carbs g</span></div><div><b>${r.fat??"–"}</b><span>fat g</span></div></div>
    <h3>Ingredients</h3><ul>${r.ingredients.map(i=>`<li>${esc(i)}</li>`).join("")}</ul><h3>Method</h3><ol>${r.steps.map(i=>`<li>${esc(i)}</li>`).join("")}</ol>${r.notes?`<div class="note">${esc(r.notes)}</div>`:""}</div>`;
}
function cleanRecipe(v){
  if(!v||typeof v.name!=="string"||!Array.isArray(v.ingredients)||!Array.isArray(v.steps))throw {code:"bad_shape"};
  const num=x=>Number.isFinite(+x)&&+x>0?Math.round(+x):undefined;
  const r={name:v.name.slice(0,120),kind:"full",cuisine:CUISINES.includes(v.cuisine)?v.cuisine:"Other",veg:!!v.veg,minutes:num(v.minutes),servings:num(v.servings),kcal:num(v.kcal),protein:num(v.protein),carbs:num(v.carbs),fat:num(v.fat),
    ingredients:v.ingredients.map(x=>String(x).trim()).filter(Boolean).slice(0,40),steps:v.steps.map(x=>String(x).trim()).filter(Boolean).slice(0,30),notes:typeof v.notes==="string"?v.notes.slice(0,500):"",meals:["lunch","dinner"]};
  if(typeof v.emoji==="string"&&v.emoji.trim()&&v.emoji.trim().length<=4)r.emoji=v.emoji.trim();
  if(/breakfast/i.test(r.name)||/breakfast/i.test(r.notes))r.meals=["breakfast","lunch"];
  return r;
}
function parseJsonReply(text){
  let t=String(text||"").replace(/```(?:json)?/gi,"").trim();
  const a=t.indexOf("{"),b=t.lastIndexOf("}");if(a<0||b<=a)throw {code:"no_json"};
  t=t.slice(a,b+1);
  try{return JSON.parse(t)}catch(e){return JSON.parse(t.replace(/,\s*([}\]])/g,"$1").replace(/[“”]/g,'"'))}
}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);return true}catch(e){}
  try{const ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();const ok=document.execCommand("copy");ta.remove();return ok}catch(e){return false}
}
function gptPrompt(req){
  const names=sortedRecipes().map(r=>r.name).slice(0,60).join("; ");
  return `I use a family meal-planning app. Give me ONE recipe as a JSON object and nothing else: no explanation, no markdown fences, exactly in this shape:
${RECIPE_SHAPE}
Rules: quantity first on each ingredient line, metric with cups or spoons where useful; timings in minutes written inside the steps; nutrition is a rough estimate per serving; "veg" is true only if there is no meat or fish; "emoji" is one emoji for the dish.
${req?`What I want: ${req}`:`We are a Nepali family learning Western dishes. Suggest a family-friendly dinner we probably haven't tried. Dishes we already have: ${names||"none yet"}.`}
If I attach a photo or paste a recipe under this message, turn THAT recipe into the JSON instead of inventing one.`;
}
function gptHtml(s){
  let body=`<p class="hint" style="margin:6px 0 10px">Works with the free ChatGPT. Two copy-pastes, and the dish lands here with nutrition filled in.</p>
    <label class="hint" for="gptq" style="display:block;margin:0 0 4px"><b>1.</b> What do you want? (optional)</label><input id="gptq" class="search" style="padding-left:14px" type="text" placeholder="e.g. a Western chicken dish under 45 minutes" value="${esc(s.q||"")}">
    <div class="row-actions" style="margin:10px 0"><button class="btn primary sm" data-act="gptcopy">${ic("copy")} Copy the prompt</button><a class="btn sm soft" href="https://chatgpt.com" target="_blank" rel="noopener">Open ChatGPT</a></div>
    <textarea id="gptprompt" class="search" style="padding-left:14px;min-height:90px;font-size:.8rem;color:var(--ink-2)" readonly>${esc(gptPrompt(s.q||""))}</textarea>
    <p class="hint" style="margin:12px 0 4px"><b>2.</b> Paste the prompt into ChatGPT. You can attach a photo of a recipe or paste recipe text under it. Then copy its whole reply and paste it here.</p>
    <textarea id="gptreply" class="search" style="padding-left:14px;min-height:100px" placeholder="Paste ChatGPT’s reply">${esc(s.reply||"")}</textarea>`;
  if(s.err)body+=`<p class="banner err">${esc(s.err)}</p>`;
  if(s.result)body+=recipePreview(s.result);
  const foot=s.result?`<button class="btn primary" data-act="aisave">${ic("check")} Save to recipes</button><button class="btn" data-act="aisaveadd">Save and add to week</button>`:`<button class="btn primary" data-act="gptread">${ic("check")} Read the reply</button>`;
  return head("Get a dish from ChatGPT")+`<div class="sheetbody">${body}</div><div class="sheetfoot">${foot}</div>`;
}
async function copyPrompt(){const ok=await copyText($("#gptprompt")?.value||"");toast(ok?"Prompt copied. Paste it into ChatGPT.":"Couldn’t copy. Select the prompt text and copy it yourself.")}
function readGptReply(){
  const s=S.sheet;if(!s)return;s.reply=$("#gptreply")?.value||"";s.err=null;s.result=null;
  try{s.result=cleanRecipe(parseJsonReply(s.reply))}catch(e){s.err="Couldn’t find a recipe in that. Copy ChatGPT’s whole reply, including the curly brackets, and try again."}
  drawSheet();
}
function estimatePrompt(){

  const name=f.name.value.trim(),desc=f.desc.value.trim(),ings=(f.ingredients?.value||"").trim();
  return `Estimate nutrition for one typical home-cooked serving of this dish, plated the way a Nepali family would serve it. Dish: ${name||"(dish name)"}.${desc?` It usually contains: ${desc}.`:""}${ings?`\nIngredients: ${ings}`:""}

function toggleEstimate(){
  const p=$("#estpanel");if(!p)return;
  if(!p.hidden){p.hidden=true;return}

    <div class="row-actions" style="margin-top:8px"><button type="button" class="btn sm" data-act="estfill">${ic("check")} Fill in the numbers</button></div></div>`;
}
async function copyEstimatePrompt(){const ok=await copyText($("#estprompt")?.value||"");toast(ok?"Prompt copied. Paste it into ChatGPT.":"Couldn’t copy. Select the prompt text and copy it yourself.")}
function fillEstimate(){
  const f=$("#editform");const st=$("#f-eststatus");if(!f)return;
  try{
    const v=parseJsonReply($("#estreply")?.value||"");const num=x=>Number.isFinite(+x)&&+x>0?Math.round(+x):"";
    f.kcal.value=num(v.kcal);f.protein.value=num(v.protein);f.carbs.value=num(v.carbs);f.fat.value=num(v.fat);
    if(!f.minutes.value&&num(v.minutes))f.minutes.value=num(v.minutes);
    if(typeof v.veg==="boolean")$("#f-veg")?.setAttribute("aria-checked",String(v.veg));
    if(!f.emoji.value&&typeof v.emoji==="string"&&v.emoji.trim()&&v.emoji.trim().length<=4)f.emoji.value=v.emoji.trim();
    if(st)st.textContent="Filled in from ChatGPT’s estimate. Change anything that looks off, then save.";
    const p=$("#estpanel");if(p)p.hidden=true;
  }catch(e){if(st)st.textContent="Couldn’t find numbers in that reply. Copy ChatGPT’s whole answer, including the curly brackets."}
}

async function saveRating(rid,rating,note,itemId){
  const r=S.recipes.get(rid);if(!r)return;
  const rt={up:r.rating?.up||0,down:r.rating?.down||0};if(rating>0)rt.up++;if(rating<0)rt.down++;
  const log=[...(r.cooklog||[]),{date:fmt(new Date()),rating,note:(note||"").slice(0,200)}].slice(-20);
  await saveRecipe({...r,rating:rt,cooklog:log});
  if(itemId)patchItem(itemId,{cooked:true});
}

/* ============================================================
   Cook mode
   ============================================================ */
let wakeLock=null;
async function openCook(rid,itemId){
  const r=S.recipes.get(rid);if(!r)return;
  closeSheet();
  S.cook={rid,itemId,step:0,view:"steps",done:new Set(),servings:r.servings||S.settings.servings||4};
  $("#cook").hidden=false;document.body.style.overflow="hidden";drawCook();
  try{wakeLock=await navigator.wakeLock?.request("screen")}catch(e){wakeLock=null}
}
function closeCook(){S.cook=null;$("#cook").hidden=true;document.body.style.overflow="";try{wakeLock?.release()}catch(e){}wakeLock=null;if(!S.timers.length)stopTick()}
function drawCook(){
  const c=S.cook;if(!c)return;const r=S.recipes.get(c.rid);if(!r){closeCook();return}
  const steps=r.steps||[];const n=steps.length;const i=Math.min(c.step,Math.max(0,n-1));const f=r.servings?c.servings/r.servings:1;
  const pct=n?((i+1)/n*100):100;
  let body="";
  if(c.view==="ings"){
    body=`<p class="stepn">Ingredients ${r.servings?`<span class="stepper" style="margin-left:8px"><button data-cookserv="-1" aria-label="Fewer servings">−</button><b>Serves ${c.servings}</b><button data-cookserv="1" aria-label="More servings">+</button></span>`:""}</p><ul class="ingl">${(r.ingredients||[]).map((line,k)=>`<li class="${c.done.has(k)?"done":""}" data-ingdone="${k}"><span class="box">${c.done.has(k)?ic("check"):""}</span><span>${esc(scaleLine(line,f))}</span></li>`).join("")}</ul>`;
  }else{
    const timers=durationsIn(steps[i]||"");
    body=`<p class="stepn">Step ${n?i+1:0} of ${n}</p><p class="step">${esc(steps[i]||"No steps written for this dish yet.")}</p>
      <div class="timers">${timers.map(t=>{const run=S.timers.find(x=>x.stepKey===c.rid+":"+i+":"+t.secs);return run?timerChip(run):`<button class="timerchip" data-timer="${t.secs}" data-tlabel="${esc(t.label)}">${ic("clock")} Start ${t.label} timer</button>`}).join("")}</div>`;
  }
  const others=S.timers.filter(t=>c.view!=="steps"||!t.stepKey.startsWith(c.rid+":"+i+":"));
  $("#cook").innerHTML=`<div class="ch"><button class="ibtn" data-act="closecook" aria-label="Leave cook mode">${ic("x")}</button><h2>${esc(r.name)}</h2>${r.minutes?`<span class="pill">${ic("clock")} ${r.minutes} min</span>`:""}</div>
    <div class="prog"><i style="width:${pct}%"></i></div>
    <div class="tabs"><button data-cookview="steps" aria-selected="${c.view==="steps"}">Steps</button><button data-cookview="ings" aria-selected="${c.view==="ings"}">Ingredients${r.ingredients?.length?` ${c.done.size}/${r.ingredients.length}`:""}</button></div>
    ${others.length?`<div class="timers" style="padding:0 16px 8px;max-width:760px;width:100%;margin:0 auto">${others.map(timerChip).join("")}</div>`:""}
    <div class="cb">${body}</div>
    <div class="cf">${c.view==="steps"?`<button class="btn" data-cookstep="-1" ${i===0?"disabled":""}>${ic("left")} Back</button>${i>=n-1?`<button class="btn primary" data-act="cookdone">${ic("check")} Done cooking</button>`:`<button class="btn primary" data-cookstep="1">Next ${ic("right")}</button>`}`:`<button class="btn primary" data-cookview="steps">Back to steps</button>`}</div>`;
}
function timerChip(t){
  const left=Math.round((t.end-Date.now())/1000);const over=left<=0;
  return `<button class="timerchip ${over?"over":"run"}" data-timerstop="${t.id}" title="Stop timer">${ic(over?"bell":"clock")} ${over?"Time’s up":fmtClock(left)}<small style="font-weight:500;opacity:.8">${esc(t.label)}</small> ${ic("x")}</button>`;
}
let tickT=null;
function startTick(){if(!tickT)tickT=setInterval(()=>{let changed=false;for(const t of S.timers){if(!t.rang&&t.end<=Date.now()){t.rang=true;ring();changed=true}}if(S.cook)drawCook();else if(!S.timers.length)stopTick()},1000)}
function stopTick(){clearInterval(tickT);tickT=null}
function ring(){
  try{navigator.vibrate?.([300,150,300,150,600])}catch(e){}
  try{const ctx=new (window.AudioContext||window.webkitAudioContext)();const now=ctx.currentTime;[0,.35,.7,1.05].forEach(off=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type="sine";o.frequency.value=880;g.gain.setValueAtTime(.0001,now+off);g.gain.exponentialRampToValueAtTime(.4,now+off+.02);g.gain.exponentialRampToValueAtTime(.0001,now+off+.3);o.connect(g).connect(ctx.destination);o.start(now+off);o.stop(now+off+.32)})}catch(e){}
}

const WALK=[["🍛","Welcome to Our Kitchen","Tap any empty meal to choose a dish. Every change is shared with the family straight away."],["✨","Out of ideas?","Plan my week fills the empty meals using your rules: no repeats, veg days, one new dish to try. Then tweak whatever you like."],["🔥","When it’s time to cook","Open a recipe and tap Cook for big step-by-step text, timers, and a screen that stays awake. Rate it after, so the app learns what the family loves."]];
function drawWalk(){
  const w=$("#walk");if(S.walk==null){w.hidden=true;w.innerHTML="";return}
  const [em,t,p]=WALK[S.walk];const last=S.walk===WALK.length-1;
  w.hidden=false;w.innerHTML=`<div class="cardw" role="dialog" aria-modal="true"><div class="big">${em}</div><h2>${t}</h2><p>${p}</p><div class="dotsw">${WALK.map((_,i)=>`<i class="${i===S.walk?"on":""}"></i>`).join("")}</div><div class="row-actions" style="justify-content:center"><button class="btn primary" data-act="walknext">${last?"Let’s cook":"Next"}</button>${last?"":`<button class="btn ghost" data-act="walkskip">Skip</button>`}</div></div>`;
}

function go(tab){S.tab=tab;render();window.scrollTo(0,0)}
function setWeek(id){S.weekId=id;S.weekTouched=true;S.activeDay=null;render()}
function openRecipeFromAI(add){
  const s=S.sheet;const r=s.result;if(!r)return;
  saveRecipe({...r,createdAt:Date.now()}).then(id=>{if(add){closeSheet();openSheet("slotpick",{rid:id})}});
  toast(`Saved ${r.name}`);if(!add)closeSheet();
}
async function resizeImage(file,max=560){
  const bmp=await createImageBitmap(file);
  const sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas");c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  return c.toDataURL("image/jpeg",.72);
}
async function uploadPhoto(rid,file){
  if(!file)return;
  try{const data=await resizeImage(file);if(data.length>700000){toast("That photo is too large even after shrinking. Try another.");return}const r=S.recipes.get(rid);if(r)await saveRecipe({...r,photoData:data});toast("Photo added")}
  catch(e){toast("Couldn’t read that photo. Try a JPG or PNG.")}
}
function exportBackup(){
  const recipes={};for(const [id,r] of S.recipes){const c={...r};delete c.id;recipes[id]=c}
  const data={app:"our-kitchen",version:1,exportedAt:new Date().toISOString(),settings:S.settings,recipes,weeks:Object.fromEntries(S.weeks)};
  const blob=new Blob([JSON.stringify(data,null,1)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`our-kitchen-backup-${iso(new Date())}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast("Backup downloaded");
}
async function writeMany(groups){
  let batch=S.db.batch(),n=0;
  for(const [col,docs] of Object.entries(groups))for(const [id,doc] of Object.entries(docs)){batch.set(S.db.collection(col).doc(id),doc);if(++n>=400){await batch.commit();batch=S.db.batch();n=0}}
  if(n)await batch.commit();
}
async function importBackup(file){
  if(!S.db)return;
  try{
    const data=JSON.parse(await file.text());if(data.app!=="our-kitchen"||typeof data.recipes!=="object")throw 0;
    const n=Object.keys(data.recipes||{}).length,w=Object.keys(data.weeks||{}).length;
    if(!confirm(`Restore ${n} dishes and ${w} weeks from this backup? Dishes with the same id are replaced; everything else is kept.`))return;
    await writeMany({recipes:data.recipes||{},weeks:data.weeks||{}});
    if(data.settings)await S.db.doc("settings/main").set({...DEFAULT_SETTINGS,...data.settings});
    toast("Backup restored");closeSheet();
  }catch(e){toast("That file isn’t an Our Kitchen backup.")}
}
async function addStarters(){
  if(!S.db)return;const docs={};for(const [id,r] of Object.entries(STARTER_RECIPES))if(!S.recipes.has(id))docs[id]={...r,createdAt:Date.now()};
  const n=Object.keys(docs).length;if(!n){toast("The starter recipes are already in your list");return}
  try{await writeMany({recipes:docs});toast(`Added ${n} starter recipes. Delete the ones you won’t cook.`);closeSheet()}catch(e){handleWriteError(e)}
}
